<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Cash Paid Salary - Bilal Accounting System</title>
    <!-- CSS Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/sidebar.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1e4c8c 0%, #2c5ba9 100%);
            --accent-color: #00a65a;
            --border-color: rgba(255, 255, 255, 0.2);
        }

        body {
            background-color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 0.85rem;
        }

        .filter-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .filter-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-group.small {
            flex: 0.5;
            min-width: 120px;
        }

        .filter-panel label {
            font-weight: 600;
            font-size: 13px;
            color: #475569;
            margin-bottom: 6px;
            display: block;
        }

        .filter-panel .form-select,
        .filter-panel .form-control {
            border: 1px solid #cbd5e1;
            background: white;
            color: #1e293b;
            padding: 8px 12px;
            font-size: 0.85rem;
            border-radius: 4px;
            height: 40px;
            transition: all 0.3s;
        }

        .filter-panel .form-select:focus,
        .filter-panel .form-control:focus {
            border-color: #1e4c8c;
            box-shadow: 0 0 0 2px rgba(30, 76, 140, 0.1);
            outline: none;
        }

        /* Search Suggestions */
        #suggestionsBox {
            position: absolute;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-height: 250px;
            overflow-y: auto;
            z-index: 1100;
            display: none;
            margin-top: 5px;
            border: 1px solid #e2e8f0;
        }

        .suggestion-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
            transition: all 0.2s;
            font-size: 0.8rem;
        }

        .suggestion-item:hover,
        .suggestion-item.focused {
            background: #1e4c8c;
            color: white;
        }

        .btn-view {
            background: #28a745;
            color: white;
            border: none;
            padding: 0 20px;
            height: 40px;
            border-radius: 4px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-view:hover {
            background: #218838;
        }

        .data-panel {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 12px 15px;
        }

        .data-table thead th {
            background: #1e4c8c;
            color: white;
            font-weight: 600;
            text-align: center;
            border: 1px solid white;
        }

        .data-table tbody td {
            border: 1px solid #f1f5f9;
            color: #334155;
        }

        .amount-col {
            text-align: right !important;
        }

        .sub-total-row {
            background-color: #f1f5f9 !important;
            color: #1e293b !important;
            font-weight: bold;
        }

        .grand-total-row {
            background-color: black !important;
            color: white !important;
            font-weight: bold;
        }

        .sub-total-row td {
            border: 1px solid #cbd5e1 !important;
            height: 45px;
            vertical-align: middle;
        }

        .grand-total-row td {
            border: 1px solid white !important;
            height: 45px;
            vertical-align: middle;
        }

        .page-title-banner {
            background: #1e4c8c;
            color: white;
            padding: 10px 20px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        /* Multi-select Branch Dropdown */
        .multi-select-container {
            position: relative;
            width: 100%;
        }

        .multi-select-button {
            width: 100%;
            height: 40px;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: white;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;
        }

        .multi-select-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            max-height: 250px;
            overflow-y: auto;
            background: white;
            border: 1px solid #cbd5e1;
            border-top: none;
            border-radius: 0 0 4px 4px;
            z-index: 1050;
            display: none;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .multi-select-item {
            padding: 5px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: #334155;
        }

        .multi-select-item:hover {
            background-color: #f8fafc;
        }

        .multi-select-item input {
            cursor: pointer;
        }

        .search-branch-input {
            margin-bottom: 10px;
            height: 30px !important;
            font-size: 0.75rem !important;
        }

        .select-all-link {
            font-size: 0.75rem;
            color: #1e4c8c;
            text-decoration: underline;
            cursor: pointer;
            display: block;
            margin-bottom: 5px;
        }

        @media print {

            body,
            .main-content,
            .container-fluid,
            .data-panel {
                background: white !important;
                background-color: white !important;
            }

            .no-print,
            .page-header,
            .sidebar,
            #sidebar,
            .filter-panel,
            .page-title-banner,
            .btn-view,
            .btn-outline-secondary {
                display: none !important;
            }

            .main-content {
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
            }

            .container-fluid {
                padding: 0 !important;
            }

            .data-panel {
                border: none !important;
                box-shadow: none !important;
            }

            .data-table thead th {
                background: #1e4c8c !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .sub-total-row {
                background-color: white !important;
                color: #1e293b !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .grand-total-row {
                background-color: black !important;
                color: white !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>

<body>
    <div class="main-content">
        <!-- Page Header -->
        <div class="page-header px-3 d-flex align-items-center justify-content-between no-print"
            style="height: 50px; background: #1e4c8c; color: white;">
            <div class="d-flex align-items-center gap-3">
                <div class="d-flex align-items-center" id="sidebarToggle" style="cursor:pointer;">
                    <i class="fas fa-bars me-2"></i>
                    <span class="fw-bold small">MENU</span>
                </div>
                <button class="btn btn-sm btn-light py-0 px-2" onclick="window.history.back()" style="height: 24px;">
                    <i class="fas fa-arrow-left fa-xs"></i>
                </button>
            </div>

            <h6 class="mb-0 fw-bold text-uppercase tracking-wider">Employee Cash Paid Salary</h6>

            <div class="d-flex align-items-center gap-2">
                <div class="user-profile d-flex align-items-center border-start ps-3 ms-2"
                    style="border-color: rgba(255,255,255,0.2) !important;">
                    <span id="userNameHeader" class="me-2 fw-bold small">User</span>
                    <i class="fas fa-user-circle fa-lg"></i>
                </div>
            </div>
        </div>

        <div class="container-fluid p-3">
            <div class="page-title-banner no-print">Employee Cash Paid Salary</div>

            <div class="filter-panel no-print">
                <div class="filter-row">
                    <div class="filter-group">
                        <label>Month-Year</label>
                        <input type="month" class="form-control" id="monthFilter">
                    </div>
                    <div class="filter-group">
                        <label>Select Branch</label>
                        <div class="multi-select-container">
                            <div class="multi-select-button" id="branchMultiSelectBtn">
                                <span id="selectedBranchesText">All Branches</span>
                                <i class="fas fa-chevron-down opacity-50"></i>
                            </div>
                            <div class="multi-select-dropdown" id="branchMultiSelectDropdown">
                                <input type="text" class="form-control search-branch-input" id="searchBranch"
                                    placeholder="Search Branch">
                                <span class="select-all-link" id="selectAllBranch">select all</span>
                                <div id="branchCheckboxList">
                                    <!-- Checkboxes will be injected here -->
                                </div>
                            </div>
                        </div>
                        <input type="hidden" id="selectedBranches" value="All Branches">
                    </div>
                    <div class="filter-group">
                        <label>Branch</label>
                        <select class="form-select" id="branchTitleFilter">
                            <option value="">Select Branch</option>
                        </select>
                    </div>
                </div>

                <div class="filter-row">
                    <div class="filter-group small" style="flex: 0.3;">
                        <label>Code</label>
                        <input type="text" class="form-control" id="codeSearch" placeholder="Code">
                    </div>
                    <div class="filter-group" style="position: relative;">
                        <label>Employee</label>
                        <input type="text" class="form-control" id="empSearch" placeholder="Select Employee">
                        <input type="hidden" id="selectedEmpId">
                        <div id="suggestionsBox"></div>
                    </div>
                </div>

                <div class="filter-row align-items-end">
                    <div class="filter-group">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="exportCsv">
                            <label class="form-check-label" for="exportCsv">Export as CSV</label>
                        </div>
                        <select class="form-select" id="deptFilter">
                            <option value="">Select Department</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <select class="form-select" id="desigFilter">
                            <option value="">Select Designation</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <select class="form-select" id="paidStatusFilter">
                            <option value="Paid" selected>Cash Paid</option>
                            <option value="Advance">Advance Paid</option>
                            <option value="All">All Status</option>
                            <option value="Not Paid">Not Paid</option>
                        </select>
                    </div>
                </div>

                <div class="mt-3">
                    <button class="btn btn-view" onclick="generateReport()">View Cash Paid Salary Report</button>
                    <button class="btn btn-outline-secondary ms-2" onclick="printReport()"><i
                            class="fas fa-print me-1"></i> Print</button>
                </div>
            </div>

            <!-- Report Table Area -->
            <div class="data-panel" id="reportArea">
                <div class="text-center py-5 text-muted no-print">
                    <i class="fas fa-file-invoice-dollar fa-3x mb-3 opacity-25"></i>
                    <p>Select criteria and click "View" to generate report.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/pageAccess.js"></script>
    <script src="/js/sidebar.js?v=1789486244456"></script>
    <script src="/js/cash-paid-salary-report.js"></script>
</body>

</html>
