<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Registered List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/desktop-style.css?v=101" rel="stylesheet">
    <link href="/css/sidebar.css?v=101" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @media screen {

            .print-grid,
            .print-header,
            .print-value,
            .company-section {
                display: none !important;
            }

            .table-container {
                margin: 0 !important;
            }

            .col-diffin,
            .col-diffout {
                display: none !important;
            }
        }

        .header-controls {
            background-color: #f8f9fa;
            padding: 8px 12px;
            border: 1px solid #dee2e6;
            margin: 0 !important;
            border-bottom: none;
        }

        .header-controls .form-control,
        .header-controls .form-select,
        .header-controls .btn {
            font-size: 0.85rem !important;
            padding: 4px 8px !important;
            height: 34px !important;
        }

        .header-controls label {
            font-size: 0.85rem !important;
            white-space: nowrap;
        }

        #globalSearch,
        #globalSearch:focus,
        #globalSearch:active {
            border: none !important;
            outline: none !important;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.25) !important;
        }

        .table-container {
            background: white;
            border: 1px solid #dee2e6;
            border-top: none;
            overflow-x: auto;
        }

        .table {
            margin-bottom: 0;
            font-size: 0.92rem;
            /* Clear medium font size */
            white-space: nowrap;
            width: 100%;
            table-layout: auto;
        }

        .table thead th {
            background-color: #000 !important;
            color: #fff !important;
            font-size: 0.95rem;
            /* Large clear headers */
            text-transform: uppercase;
            padding: 10px 6px !important;
            vertical-align: middle;
            text-align: center !important;
            border-top: 1px solid #000 !important;
            border-bottom: 1px solid #000 !important;
            border-left: 1px solid #fff !important;
            border-right: 1px solid #fff !important;
        }

        .table tbody td {
            padding: 8px 6px;
            border: 1px solid #999 !important;
            vertical-align: middle;
            height: 42px;
        }

        .form-control-xs {
            height: 30px;
            padding: 2px 8px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 4px;
        }

        .form-select-sm {
            padding: 4px 8px !important;
            font-size: 0.85rem !important;
            height: 32px !important;
        }

        .form-select-xs {
            padding: 2px 8px !important;
            font-size: 0.85rem !important;
            height: 30px !important;
            border-radius: 4px;
        }

        /* Final Column Widths for Perfect Alignment & No Space */
        .col-sr {
            width: 50px;
            min-width: 50px;
            text-align: center;
        }

        .col-date {
            width: 100px;
            min-width: 100px;
            text-align: center;
        }

        .col-code {
            width: 110px;
            min-width: 110px;
            text-align: center;
        }

        .col-name {
            min-width: 200px;
            text-align: left;
        }

        .col-dept {
            width: 130px;
            min-width: 130px;
            text-align: center;
        }

        .col-desig {
            width: 130px;
            min-width: 130px;
            text-align: center;
        }

        .col-duty {
            width: 90px;
            min-width: 90px;
            text-align: center;
        }

        .col-checkin,
        .col-checkout,
        .col-breakout,
        .col-breakin,
        .col-diffin,
        .col-diffout {
            width: 110px;
            min-width: 110px;
            text-align: center;
        }

        .col-worked {
            width: 70px;
            min-width: 70px;
            text-align: center;
            white-space: normal !important;
            word-break: break-word;
            line-height: 1.2;
        }

        .col-totalhrs {
            width: 90px;
            min-width: 90px;
            text-align: center;
        }

        .col-breakhrs,
        .col-totaldiff {
            width: 70px;
            min-width: 70px;
            text-align: center;
            white-space: normal !important;
            word-break: break-word;
            line-height: 1.2;
        }

        .col-status {
            width: 110px;
            min-width: 110px;
            text-align: center;
        }

        .code-link-box {
            padding: 2px 4px;
            font-size: 0.95rem;
        }

        /* Screen Styles for Rows */
        .row-completed td {
            background-color: #28a745 !important;
            color: #ffffff !important;
        }

        .row-partial td {
            background-color: #fff176 !important;
            color: black !important;
        }

        .row-absent td {
            background-color: #ea1c0d !important;
            color: #ffffff !important;
        }

        .row-overtime td {
            background-color: #C0B0FF !important;
            color: white !important;
            border: 2px solid #FFFFFF !important;
        }

        .row-warning td {
            background-color: #fd7e14 !important;
            color: white !important;
        }

        .row-leave td {
            background-color: #fff3cd !important;
            color: #856404 !important;
        }

        .row-missed-in td {
            background-color: #f8d7da !important;
            color: #721c24 !important;
            border: 1px solid #dc3545 !important;
        }

        /* DIFF Colors - More specific to override row classes */
        td.bg-minus {
            background-color: #ea1c0d !important;
            color: white !important;
        }

        /* NUCLEAR PRINT RESET - BYPASS EVERYTHING */
        @media print {

            html,
            body {
                background: white !important;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }

            body>*:not(#print-only-root) {
                display: none !important;
                visibility: hidden !important;
                height: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            #print-only-root {
                display: block !important;
                visibility: visible !important;
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
            }

            @page {
                size: portrait;
                margin: 0.8cm;
            }

            .print-header {
                text-align: center;
                margin-bottom: 5mm;
                border-bottom: 1.5pt solid #000;
                padding-bottom: 2mm;
            }

            .print-header h1 {
                font-size: 22pt !important;
                margin: 0;
                font-weight: bold;
                text-transform: uppercase;
            }

            .print-header h2 {
                font-size: 13pt !important;
                margin: 4px 0;
                font-weight: bold;
            }

            .print-header h3 {
                font-size: 11pt !important;
                margin: 2px 0;
                font-weight: bold;
            }

            .print-table {
                width: 100% !important;
                border-collapse: collapse !important;
                font-family: Arial, sans-serif !important;
                margin-top: 2mm;
            }

            .print-table th,
            .print-table td {
                border: 0.5pt solid #000 !important;
                padding: 6px 1px !important; /* Increased vertical padding for height */
                font-size: 8.5pt !important; /* Increased font size for readability */
                text-align: center !important;
                vertical-align: middle !important;
                line-height: 1.1 !important;
            }

            .print-table th {
                background-color: #eeeeee !important;
                font-weight: bold !important;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }

            /* Black columns from reference */
            .print-table th.black-col {
                background-color: #000 !important;
                color: #fff !important;
                border: 0.5pt solid #000 !important;
                /* Base black border */
                border-left: 0.5pt solid #fff !important;
                /* WHITE VERTICAL SEPARATOR */
                border-right: 0.5pt solid #fff !important;
                /* WHITE VERTICAL SEPARATOR */
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }

            .print-table td.name-cell {
                text-align: left !important;
                padding-left: 5px !important;
                text-transform: uppercase;
                font-weight: bold;
            }
        }

        /* Screen behavior */
        @media screen {
            #print-only-root {
                display: none !important;
            }
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            .page-header {
                padding: 0.5rem 0.75rem !important;
                background: #000 !important;
            }

            .page-header #userName,
            .page-header .fa-chevron-down {
                display: none;
            }

            .header-controls {
                display: none !important;
            }

            .container-fluid {
                padding-bottom: 75px !important;
            }

            #globalSearch {
                padding: 10px 15px !important;
                font-size: 0.9rem !important;
                border-bottom: 2px solid #dee2e6 !important;
            }

            .table-container {
                height: calc(100vh - 160px) !important;
                overflow: auto;
            }

            .action-bar-mobile {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: white;
                display: flex !important;
                justify-content: space-around;
                padding: 8px 5px;
                box-shadow: 0 -2px 15px rgba(0, 0, 0, 0.1);
                z-index: 1050;
                border-top: 1px solid #e2e8f0;
                height: 65px;
            }

            .action-btn-mobile {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: none;
                border: none;
                color: #64748b;
                font-size: 0.65rem;
                font-weight: 600;
                flex: 1;
            }

            .action-btn-mobile i {
                font-size: 1.25rem;
                margin-bottom: 3px;
            }

            .btn-search i {
                color: #10b981;
            }

            .btn-print i {
                color: #3b82f6;
            }

            .btn-import i {
                color: #ef4444;
            }

            .btn-filter i {
                color: #f59e0b;
            }
        }
    </style>

    <style>
        @media print {
            /* Ensure print-value elements are visible in print preview */
            .print-value { display: inline !important; }
            /* Hide interactive UI controls on print */
            .no-print { display: none !important; }
            /* Use a font capable of Urdu rendering if available */
            .col-name .print-value { font-family: 'Noto Nastaliq Urdu', 'Noto Nastaliq Arabic', 'Times New Roman', serif; }
        }
    </style>
<style>.scroll-nav-btn { position: fixed; bottom: 40px; width: 45px; height: 45px; background: #1e4c8c; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 9999; box-shadow: 0 4px 15px rgba(0,0,0,0.3); opacity: 0.8; transition: all 0.3s ease; border: 2px solid rgba(255,255,255,0.2); text-decoration: none; } .scroll-nav-btn:hover { opacity: 1; transform: scale(1.1); background: #153866; color: white; } .scroll-nav-left { right: 80px; } .scroll-nav-right { right: 25px; } @media (max-width: 768px) { .scroll-nav-btn { bottom: 20px; width: 35px; height: 35px; } .scroll-nav-left { right: 60px; } .scroll-nav-right { right: 15px; } }</style></head>

<body>
    <!-- Print Exclusive Header (At very top to avoid containers) -->
    <div class="company-section">
        <h1>Dwatson</h1>
        <h2 id="pBranchHeader">Branch: (All Branches)</h2>
        <h3>Employee Attendance Sheet <span id="pDateRange"></span></h3>
    </div>

    <!-- Screen UI Wrapper -->
    <div class="no-print">
        <div class="page-header px-3">
            <div style="flex: 1; display: flex; align-items: center;">
                <i class="fas fa-bars me-3" id="sidebarToggle" style="cursor:pointer; font-size: 1rem;"></i>
                Attendance Registered List
            </div>
            <div style="flex: 1; display: flex; justify-content: flex-end; align-items: center;">
                <div class="dropdown">
                    <div class="d-flex align-items-center text-white" data-bs-toggle="dropdown"
                        style="cursor: pointer;">
                        <i class="fas fa-user-circle me-2" style="font-size: 1.2rem;"></i>
                        <span id="userName" class="me-2">User</span>
                        <i class="fas fa-chevron-down" style="font-size: 0.7rem;"></i>
                    </div>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                        <li><a class="dropdown-item py-2 logout-btn" href="#"><i
                                    class="fas fa-sign-out-alt me-2 text-danger"></i>Sign Out</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="header-controls">
            <div class="d-flex gap-2 align-items-center justify-content-between flex-nowrap overflow-auto py-1">
                <div class="d-flex gap-2 align-items-center">
                    <label class="fw-bold">From</label>
                    <input type="date" id="fromDate" class="form-control" style="width: 140px;">
                    <label class="fw-bold">To</label>
                    <input type="date" id="toDate" class="form-control" style="width: 140px;">

                    <select id="filterBranch" class="form-select" style="width: 140px;" onchange="loadAttendanceList()">
                        <option value="" disabled selected>Branch</option>
                    </select>
                    <select id="filterDept" class="form-select" style="width: 160px;">
                        <option value="">Department</option>
                    </select>
                    <select id="filterDesig" class="form-select" style="width: 160px;">
                        <option value="">Designation</option>
                    </select>
                    <select id="filterStatus" class="form-select" style="width: 160px;">
                        <option value="">Status</option>
                        <option value="Present">Only Present</option>
                        <option value="Absent">Only Absent</option>
                        <option value="Leave">Only Leave</option>
                        <option value="no_checkinout">No Check In-Out (Missing)</option>
                        <option value="checkin_no_out">CheckIn but No Out</option>
                        <option value="less_1hr">Less then 1 Hrs</option>
                        <option value="greater_17hr">Greater then 17 Hrs</option>
                    </select>
                </div>

                <div class="d-flex gap-1">
                    <button class="btn btn-success fw-bold" onclick="loadAttendanceList()"><i class="fas fa-search"></i>
                        Search</button>
                    <button class="btn btn-info text-white fw-bold" onclick="handlePrint()"><i class="fas fa-print"></i>
                        Print</button>
                    <button class="btn btn-danger fw-bold"
                        onclick="window.location.href='/import-attendance'">Import</button>
                    <button id="btnBulkSave" class="btn btn-primary fw-bold" style="background-color: #6a1b9a !important; border:none !important;" onclick="bulkSaveAll()">
                        <i class="fas fa-database"></i> Bulk Save All</button>
                    <button id="timerBtn" class="btn btn-warning fw-bold" onclick="toggleAutoRefresh()"><i
                            class="fas fa-play"></i> LIVE</button>
                </div>
            </div>
        </div>

        <div style="margin: 0; padding: 0;">
            <input type="text" id="globalSearch" class="fw-bold d-block w-100"
                placeholder="🔍  SEARCH by name, code, department, designation..."
                onkeyup="handleGlobalSearch(this.value)"
                style="background: #f0f2f5 !important; border: none !important; outline: none !important; color: #333; font-size: 0.88rem; padding: 7px 14px; width: 100%; border-radius: 0;">
        </div>
    </div>

    <div class="container-fluid p-0">

        <div class="table-container">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th class="col-sr">SrNo</th>
                        <th class="col-date">Date</th>
                        <th class="col-code">Code</th>
                        <th class="col-name">Name</th>
                        <th class="col-dept">Department</th>
                        <th class="col-desig">Designation</th>
                        <th class="col-duty">Duty Hours</th>
                        <th class="col-checkin">Check In</th>
                        <th class="col-checkout">Check Out</th>
                        <th class="col-worked" style="white-space:normal;line-height:1.2;">Worked Hrs</th>
                        <th class="col-breakout">Break Out</th>
                        <th class="col-breakin">Break In</th>
                        <th class="col-breakhrs" style="white-space:normal;line-height:1.2;">Total Brk Hrs</th>
                        <th class="col-diffin">Diff In</th>
                        <th class="col-diffout">Diff Out</th>
                        <th class="col-totaldiff" style="white-space:normal;line-height:1.2;">Total Diff Hrs</th>
                        <th class="col-totalhrs">Total Hrs</th>
                        <th class="col-status">Status</th>
                    </tr>
                </thead>
                <tbody id="attendanceRecordsBody">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Mobile Bottom Action Bar -->
    <div class="action-bar-mobile d-none no-print">
        <button type="button" class="action-btn-mobile btn-filter" data-bs-toggle="modal"
            data-bs-target="#mobileFilterModal">
            <i class="fas fa-filter"></i><span>Filters</span>
        </button>
        <button type="button" class="action-btn-mobile btn-search" onclick="loadAttendanceList()">
            <i class="fas fa-search"></i><span>Refresh</span>
        </button>
        <button type="button" class="action-btn-mobile btn-print" onclick="handlePrint()">
            <i class="fas fa-print"></i><span>Print</span>
        </button>
        <button type="button" class="action-btn-mobile btn-import" onclick="location.reload()">
            <i class="fas fa-file-import"></i><span>Import</span>
        </button>
    </div>

    <!-- Mobile Filter Modal -->
    <div class="modal fade" id="mobileFilterModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Attendance Filters</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label small fw-bold">From Date</label>
                            <input type="date" id="mFromDate" class="form-control"
                                onchange="document.getElementById('fromDate').value = this.value">
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-bold">To Date</label>
                            <input type="date" id="mToDate" class="form-control"
                                onchange="document.getElementById('toDate').value = this.value">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">Branch</label>
                            <select id="mFilterBranch" class="form-select"
                                onchange="document.getElementById('filterBranch').value = this.value; document.getElementById('filterBranch').dispatchEvent(new Event('change'))">
                                <option value="" disabled selected>Select Branch</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">Department</label>
                            <select id="mFilterDept" class="form-select"
                                onchange="document.getElementById('filterDept').value = this.value">
                                <option value="">Select Department</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">Status</label>
                            <select id="mFilterStatus" class="form-select"
                                onchange="document.getElementById('filterStatus').value = this.value">
                                <option value="">All Attendance</option>
                                <option value="Present">Only Present</option>
                                <option value="Absent">Only Absent</option>
                                <option value="Leave">Only Leave</option>
                                <option value="no_checkinout">No Check In-Out (Missing)</option>
                                <option value="checkin_no_out">CheckIn but No Out</option>
                                <option value="less_1hr">Less then 1 Hrs</option>
                                <option value="greater_17hr">Greater then 17 Hrs</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary w-100"
                        onclick="loadAttendanceList(); bootstrap.Modal.getInstance(document.getElementById('mobileFilterModal')).hide();">Apply
                        Filters</button>
                </div>
            </div>
        </div>
    </div>

    <!-- This container is ONLY for printing -->
    <div id="print-only-root"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/pageAccess.js"></script>
    <script src="/js/sidebar.js?v=1789486244440"></script>
    <script src="/js/attendance.js?v=4.4"></script>
    <script>
        document.getElementById('mobileFilterModal').addEventListener('shown.bs.modal', function () {
            document.getElementById('mFromDate').value = document.getElementById('fromDate').value;
            document.getElementById('mToDate').value = document.getElementById('toDate').value;
            const branchSelect = document.getElementById('filterBranch');
            const mBranchSelect = document.getElementById('mFilterBranch');
            if (mBranchSelect.options.length <= 1) {
                Array.from(branchSelect.options).forEach(opt => {
                    if (opt.value) mBranchSelect.add(new Option(opt.text, opt.value));
                });
            }
            mBranchSelect.value = branchSelect.value;
            const deptSelect = document.getElementById('filterDept');
            const mDeptSelect = document.getElementById('mFilterDept');
            if (mDeptSelect.options.length <= 1) {
                Array.from(deptSelect.options).forEach(opt => {
                    if (opt.value) mDeptSelect.add(new Option(opt.text, opt.value));
                });
            }
            mDeptSelect.value = deptSelect.value;
        });
    </script>
<!-- Floating Scroll --><a class='scroll-nav-btn scroll-nav-left' id='btnScrollLeft' title='Scroll Left' style='display:none;'><i class='fas fa-chevron-left'></i></a><a class='scroll-nav-btn scroll-nav-right' id='btnScrollRight' title='Scroll Right' style='display:none;'><i class='fas fa-chevron-right'></i></a><script>(function(){function init(){const l=document.getElementById('btnScrollLeft'),r=document.getElementById('btnScrollRight');if(!l||!r)return;const getT=()=>document.querySelector('.modal.show .table-container')||document.querySelector('.modal.show .table-responsive')||document.querySelector('.tab-pane.active .table-container')||document.querySelector('.tab-pane.active .table-responsive')||document.querySelector('.table-container')||document.querySelector('.table-responsive');l.onclick=()=>{const t=getT();if(t)t.scrollBy({left:-400,behavior:'smooth'})};r.onclick=()=>{const t=getT();if(t)t.scrollBy({left:400,behavior:'smooth'})};const up=()=>{const t=getT();if(t&&t.scrollWidth>t.clientWidth+5){l.style.display='flex';r.style.display='flex'}else{l.style.display='none';r.style.display='none'}};window.addEventListener('resize',up);document.addEventListener('click',()=>setTimeout(up,500));setInterval(up,2000)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})()</script></body>

</html>
