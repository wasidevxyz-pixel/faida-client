<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub-Department-Wise Report - Bilal Accounting System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/sidebar.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1e4c8c 0%, #2c5ba9 100%);
            --accent-color: #00a65a;
            --border-color: rgba(255, 255, 255, 0.2);
        }

        body {
            background-color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 1rem;
            margin: 0;
            padding: 0;
        }

        .main-content {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Two-Row Filter Panel */
        .filter-panel {
            background: var(--primary-gradient);
            padding: 20px;
            border-radius: 0 !important;
            /* Sharp corners */
            margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .filter-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .filter-row:last-child {
            margin-bottom: 0;
            align-items: flex-end;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-panel label {
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
            display: block;
            opacity: 1;
            color: white;
        }

        .filter-panel .form-select,
        .filter-panel .form-control {
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.1);
            color: white !important;
            padding: 6px 12px;
            font-size: 0.9rem;
            border-radius: 0 !important;
            /* Sharp corners */
            height: 38px;
            transition: all 0.3s;
        }

        .filter-panel .form-select option {
            background: #1e4c8c;
            color: white;
        }

        .filter-panel .form-select:focus,
        .filter-panel .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
            border-color: white;
            outline: none;
        }

        /* Report Table Styling */
        .data-panel {
            background: white;
            border-radius: 0 !important;
            /* Sharp corners */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #dee2e6;
        }

        .table-responsive {
            flex: 1;
            overflow: auto;
        }

        .custom-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            table-layout: fixed;
        }

        .custom-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .custom-table th,
        .custom-table td {
            border: 1px solid #dee2e6;
            padding: 10px 12px;
            word-break: break-all;
        }

        .custom-table thead th {
            background: #1e4c8c !important;
            color: white !important;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
            font-size: 0.95rem;
            letter-spacing: 0.8px;
            white-space: nowrap;
            padding: 12px 10px;
            border-right: 2px solid white !important;
            border-bottom: 2px solid white !important;
        }

        .custom-table thead th:last-child {
            border-right: 2px solid white !important;
        }

        .custom-table tbody td {
            vertical-align: middle;
            color: #334155;
        }

        /* Class-based styles to replace inline JS */
        /* Class-based styles to replace inline JS */
        .group-header td {
            background: #f1f5f9 !important;
            color: #1e4c8c !important;
            font-size: 0.95rem;
            border: 1px solid #dee2e6 !important;
            font-weight: 700 !important;
            padding: 10px 15px !important;
        }

        .dept-row {
            font-size: 0.95rem;
        }

        .dept-badge {
            font-size: 0.95rem !important;
            font-weight: 600 !important;
        }

        .disc-value {
            color: #f59e0b;
            font-weight: 600;
        }

        .disc-perc-badge {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #10b981;
            font-size: 0.85rem !important;
        }

        .daily-avg-cell {
            background-color: #f8faff;
        }

        .subtotal-row td {
            background: #f8fafc !important;
            border: 1px solid #dee2e6 !important;
            font-size: 0.95rem;
            font-weight: 700 !important;
            color: #1e4c8c !important;
        }

        .subtotal-badge {
            font-size: 0.85rem !important;
        }

        .total-row td {
            background: #0f172a !important;
            color: white !important;
            font-weight: 800 !important;
            font-size: 0.95rem !important;
            padding: 12px 10px !important;
            border-right: 2px solid white !important;
            border-bottom: 2px solid white !important;
        }

        .total-row td:last-child {
            border-right: none !important;
        }

        /* Summary Cards */
        .summary-cards-row {
            margin-bottom: 20px;
        }

        .summary-card {
            padding: 15px 20px;
            border-radius: 0;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
        }

        .summary-card:hover {
            transform: translateY(-2px);
        }

        .summary-card.yellow {
            background: #f59e0b;
        }

        .summary-card.dark {
            background: #1e293b;
        }

        .summary-card .label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            opacity: 0.9;
        }

        .summary-card .value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* Buttons */
        .btn-view {
            background: #28a745;
            color: white;
            border: 1.5px solid white;
            padding: 0 25px;
            height: 38px;
            border-radius: 0;
            font-weight: 700;
            font-size: 0.8rem;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-view:hover {
            background: #218838;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        .btn-print {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            height: 38px;
            width: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0;
            transition: all 0.2s;
        }

        .btn-print:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .print-header {
            display: none;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 0.5cm;
            }

            body {
                background: white !important;
                font-size: 6.5pt !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .filter-panel,
            .page-header,
            .sidebar,
            #sidebarToggle,
            .dropdown,
            .summary-cards-row,
            .btn-outline-primary,
            .fa-plus {
                display: none !important;
            }

            .main-content {
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
            }

            .container-fluid {
                width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .print-header {
                display: block !important;
                text-align: center;
                margin-bottom: 20px;
                border-bottom: 2px solid #1e4c8c;
                padding-bottom: 10px;
            }

            /* Force table to fit */
            .custom-table {
                width: 100% !important;
                table-layout: fixed !important;
                font-size: 6.5pt !important;
                border-collapse: collapse !important;
            }

            .custom-table th,
            .custom-table td {
                padding: 6px 2px !important;
                overflow: hidden;
                word-wrap: break-word !important;
                border: 0.5pt solid #000 !important;
                font-size: 6.5pt !important;
                vertical-align: middle !important;
            }

            .custom-table thead th {
                white-space: nowrap !important;
                font-size: 6.8pt !important;
            }

            /* Optimized Widths for A4 */
            .custom-table th:nth-child(1),
            .custom-table td:nth-child(1) {
                width: 10%;
            }

            /* Branch */
            .custom-table th:nth-child(2),
            .custom-table td:nth-child(2) {
                width: 22%;
            }

            /* Sub-Dept */
            .custom-table th:nth-child(3),
            .custom-table td:nth-child(3) {
                width: 12%;
            }

            /* Disc Value */
            .custom-table th:nth-child(4),
            .custom-table td:nth-child(4) {
                width: 8%;
            }

            /* Disc % */
            .custom-table th:nth-child(5),
            .custom-table td:nth-child(5) {
                width: 15%;
            }

            /* Net Sale */
            .custom-table th:nth-child(6),
            .custom-table td:nth-child(6) {
                width: 15%;
            }

            /* Cost */
            .custom-table th:nth-child(7),
            .custom-table td:nth-child(7) {
                width: 18%;
            }

            /* Daily Avg */

            .custom-table tr.branch-header td,
            .custom-table tr.group-header td {
                background: #f8fafc !important;
                color: #1e4c8c !important;
                padding: 6px 4px !important;
                font-weight: bold !important;
                font-size: 8pt !important;
            }

            .custom-table tr.table-dark th {
                background: #1e4c8c !important;
                color: white !important;
                padding: 6px 2px !important;
            }

            .badge {
                border: none !important;
                padding: 0 !important;
                background: none !important;
                color: black !important;
                font-size: 6.5pt !important;
            }

            .data-panel {
                border: 1px solid #000 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
            }
        }
    </style>
</head>

<body>
    <div class="main-content">
        <!-- Page Header -->
        <div class="page-header px-3 d-flex align-items-center justify-content-between"
            style="height: 50px; background: white; border-bottom: 1px solid #e2e8f0;">
            <div class="d-flex align-items-center">
                <i class="fas fa-bars me-3" id="sidebarToggle" style="cursor:pointer; font-size: 1rem;"></i>
                <h5 class="mb-0 fw-bold" style="color: #1e4c8c;">Sub-Department Wise Sales Report</h5>
            </div>
            <div class="dropdown">
                <div class="d-flex align-items-center text-dark" data-bs-toggle="dropdown" style="cursor: pointer;">
                    <i class="fas fa-user-circle me-2" style="font-size: 1.2rem;"></i>
                    <span id="userName" class="me-2">User</span>
                    <i class="fas fa-chevron-down" style="font-size: 0.7rem;"></i>
                </div>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                    <li><a class="dropdown-item logout-btn" href="#"><i
                                class="fas fa-sign-out-alt me-2 text-danger"></i>Sign Out</a></li>
                </ul>
            </div>
        </div>

        <!-- Print Header -->
        <div class="print-header">
            <h2 class="fw-bold mb-1 text-uppercase">D.Watson</h2>
            <h4 class="mb-2">Sub-Department Wise Sales Report</h4>
            <div class="small">
                <strong>From:</strong> <span id="pFromDate"></span> |
                <strong>To:</strong> <span id="pToDate"></span>
            </div>
            <div class="mt-1" style="font-size: 0.7rem; color: #666;">Printed on: <span id="pPrintTime"></span></div>
        </div>

        <div class="container-fluid p-3">
            <!-- Filter Panel -->
            <div class="filter-panel shadow-sm d-print-none">
                <div class="filter-row">
                    <div class="filter-group">
                        <label>Branch</label>
                        <select id="branchSelect" class="form-select">
                            <option value="">All Branches</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Sub-Department</label>
                        <select id="deptSelect" class="form-select">
                            <option value="">All Sub-Departments</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>From Date</label>
                        <input type="date" id="fromDate" class="form-control">
                    </div>
                    <div class="filter-group">
                        <label>To Date</label>
                        <input type="date" id="toDate" class="form-control">
                    </div>
                </div>
                <div class="filter-row">
                    <div class="d-flex gap-2">
                        <button class="btn btn-view btn-generate" onclick="generateReport()">
                            <i class="fas fa-file-alt"></i> View Report
                        </button>
                        <button class="btn btn-print" title="Print Report" onclick="prepareAndPrint()">
                            <i class="fas fa-print"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Summary Cards -->
            <div class="summary-cards-row">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="summary-card yellow">
                            <div class="label">Total Discount</div>
                            <div class="value" id="totalDiscount">0</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="summary-card dark">
                            <div class="label">Net Sale</div>
                            <div class="value" id="netSale">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Report Table -->
            <div class="data-panel shadow-sm" id="reportContentArea">
                <div class="table-responsive">
                    <table class="custom-table" id="reportTable">
                        <thead>
                            <!-- Headers will be rendered dynamically by JS -->
                        </thead>
                        <tbody id="reportTableBody">
                            <tr>
                                <td colspan="7" class="text-center py-5 text-muted">
                                    <i class="fas fa-search fa-3x mb-3 opacity-25"></i>
                                    <p>Use filters above to generate the report.</p>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot id="reportTableFoot" style="display:none;">
                            <tr class="total-row">
                                <td colspan="2" class="text-end"
                                    style="border-right: 2px solid white !important; border-bottom: 2px solid white !important; padding: 10px !important;">
                                    GRAND TOTAL:</td>
                                <td class="text-end" id="tblDisc"
                                    style="border-right: 2px solid white !important; border-bottom: 2px solid white !important; padding: 10px !important;">
                                    0</td>
                                <td id="tblAvgDisc" class="text-end"
                                    style="border-right: 2px solid white !important; border-bottom: 2px solid white !important; padding: 10px !important;">
                                    0%</td>
                                <td class="text-end" id="tblNet"
                                    style="border-right: 2px solid white !important; border-bottom: 2px solid white !important; padding: 10px !important;">
                                    0</td>
                                <td class="text-end" id="tblCost"
                                    style="border-right: 2px solid white !important; border-bottom: 2px solid white !important; padding: 10px !important;">
                                    0</td>
                                <td class="text-end" id="tblDaily"
                                    style="border-bottom: 2px solid white !important; padding: 10px !important;">0</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/pageAccess.js"></script>
    <script src="/js/sidebar.js?v=1789486244533"></script>
    <script src="/js/sub-dept-wise-report.js"></script>
    <script>
        function prepareAndPrint() {
            const fromD = document.getElementById('fromDate').value;
            const toD = document.getElementById('toDate').value;
            document.getElementById('pFromDate').textContent = fromD || 'All';
            document.getElementById('pToDate').textContent = toD || 'All';
            document.getElementById('pPrintTime').textContent = new Date().toLocaleString();
            window.print();
        }
    </script>
</body>

</html>
