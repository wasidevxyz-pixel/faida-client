<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date-Wise Sale Report - Bilal Accounting System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/desktop-style.css" rel="stylesheet">
    <link href="/css/sidebar.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1e4c8c 0%, #2c5ba9 100%);
            --accent-color: #00a65a;
            --border-color: rgba(255, 255, 255, 0.2);
        }

        * {
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background-color: #f8fafc;
            font-size: 0.85rem;
        }

        .main-container {
            padding: 20px;
            max-width: 100%;
        }

        /* Filter Panel - Matching Salary Report */
        .filter-panel {
            background: var(--primary-gradient);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            color: white;
        }

        .filter-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .filter-row:last-child {
            margin-bottom: 0;
            align-items: flex-end;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-panel label {
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
            display: block;
            opacity: 0.9;
            color: white;
        }

        .filter-panel .form-select,
        .filter-panel .form-control {
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.1);
            color: white !important;
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
            height: 38px;
            transition: all 0.3s;
        }

        .filter-panel .form-select option {
            background: #1e4c8c;
            color: white;
        }

        .filter-panel .form-select:focus,
        .filter-panel .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
            border-color: white;
            outline: none;
        }

        /* Select2 Single Override for Filter Panel */
        .select2-container--default .select2-selection--single {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid var(--border-color) !important;
            height: 38px !important;
            color: white !important;
            border-radius: 6px !important;
        }

        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: white !important;
            line-height: 36px !important;
            font-size: 0.85rem !important;
            padding-left: 12px !important;
        }

        .select2-container--default .select2-selection--single .select2-selection__arrow b {
            border-color: white transparent transparent transparent !important;
        }

        .select2-dropdown {
            background: #1e4c8c !important;
            color: white !important;
            border: 1px solid var(--border-color) !important;
        }

        .select2-results__option {
            background: #1e4c8c !important;
            color: white !important;
        }

        .select2-results__option--highlighted[aria-selected] {
            background: #2c5ba9 !important;
        }

        /* Buttons */
        .btn-generate {
            background: #28a745;
            color: white;
            border: 1.5px solid white;
            padding: 0 25px;
            height: 38px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-generate:hover {
            background: #218838;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
            color: white;
        }

        .btn-reset,
        .btn-print {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .btn-reset:hover,
        .btn-print:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }


        /* Report Table Styling */
        .data-panel {
            background: white;
            border-radius: 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #dee2e6;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }


        .data-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .data-table th,
        .data-table td {
            border: 1px solid #dee2e6;
            padding: 8px 10px;
        }

        .data-table thead th {
            background: #1e4c8c;
            color: white;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
            padding: 12px 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-bottom: none;
        }


        .data-table tbody td {
            vertical-align: middle;
            color: #334155;
            font-size: 0.95rem;
        }

        .amount-col {
            text-align: right !important;
        }

        /* Grouping Headers */
        .branch-group-header {
            background: #f8fafc;
            color: #000000 !important;
            font-weight: 800;
            padding: 10px 15px;
            text-align: center;
        }

        .branch-group-header .branch-name {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .dept-group-header {
            background: #f0f7ff;
            color: #1e4c8c;
            font-weight: 700;
            padding: 8px 15px;
            border-left: 4px solid #1e4c8c;
            border-bottom: 1px solid #e2e8f0;
        }

        .dept-group-header .dept-name {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Totals Theme */
        .dept-total-row td,
        .branch-total-row td,
        .grand-total-row td {
            color: #ffffff !important;
        }

        .dept-total-row {
            background: #475569 !important;
            font-weight: 800 !important;
            border-top: 1px solid #cbd5e1;
            text-transform: uppercase;
        }


        /* New Branch Total Row to match Salary Report if needed, or stick to grand total */
        .branch-total-row {
            background: #94a3b8 !important;
            font-weight: 800;
            border-top: 2px solid #64748b;
        }

        .grand-total-row {
            background: #0f172a !important;
            font-weight: 900;
            font-size: 0.95rem;
        }

        /* Summary Cards - Adjusted to match theme */
        .summary-card-custom {
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            color: white;
            margin-bottom: 15px;
        }

        .summary-card-custom.sale {
            background: #014d35;
        }

        .summary-card-custom.discount {
            background: #ffc107;
            color: #000;
        }

        .summary-card-custom.net {
            background: #00a65a;
        }

        .summary-card-custom .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0.9;
        }

        .summary-card-custom .value {
            font-size: 1.2rem;
            font-weight: 800;
        }

        /* Print Header Styling */
        #printOnlyHeader {
            display: none;
            margin-bottom: 30px;
            border-bottom: 2px solid #1e4c8c;
            padding-bottom: 10px;
        }

        @media print {
            @page {
                size: portrait;
                margin: 0.3cm;
            }

            .page-header,
            .filter-panel,
            .summary-row,
            #sidebarToggle,
            .btn-generate,
            .btn-reset,
            .btn-print,
            .dropdown {
                display: none !important;
            }

            #printOnlyHeader {
                display: block !important;
                margin-bottom: 12px !important;
                border-bottom: 1px solid #1e4c8c;
            }

            #printOnlyHeader h2 {
                font-size: 1.2rem !important;
                margin: 0;
            }

            #printOnlyHeader h4 {
                font-size: 0.9rem !important;
                margin: 2px 0;
            }

            .main-container {
                margin: 0 !important;
                padding: 0 !important;
            }

            .data-panel {
                box-shadow: none !important;
                border: none !important;
            }

            .data-table {
                width: 100% !important;
                border-collapse: collapse !important;
            }

            .data-table thead th {
                background: #1e4c8c !important;
                color: #ffffff !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                border: 1px solid rgba(255, 255, 255, 0.4) !important;
                font-size: 9pt !important;
                padding: 4px 2px !important;
            }

            .data-table td {
                border: 1px solid #666 !important;
                font-size: 8.6pt !important;
                padding: 3px 2px !important;
            }

            /* Hide all icons to save vertical and horizontal space */
            .data-table i {
                display: none !important;
            }

            .branch-group-header {
                background: #f8fafc !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                padding: 2px !important;
                border: 1px solid #666 !important;
            }

            .branch-name {
                font-size: 8.5pt !important;
                font-weight: bold;
            }

            .dept-group-header {
                background: #f0f7ff !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                padding: 3px 8px !important;
                border-left: 3px solid #1e4c8c !important;
                border-right: 1px solid #666 !important;
                border-bottom: 1px solid #666 !important;
            }

            .dept-name {
                font-size: 8.5pt !important;
                font-weight: bold;
            }

            .dept-total-row td,
            .grand-total-row td {
                background: #0f172a !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color: white !important;
                font-size: 9pt !important;
                padding: 4px 2px !important;
                border: 1px solid black !important;
            }

            .branch-section {
                margin-bottom: 0 !important;
            }

            .data-table thead {
                display: table-header-group;
            }

            .branch-group-header,
            .dept-group-header {
                page-break-after: avoid;
            }
        }
    </style>


</head>

<body>
    <div class="page-header px-3 d-flex align-items-center justify-content-between"
        style="height: 50px; background: white; border-bottom: 1px solid #e2e8f0;">
        <div class="d-flex align-items-center">
            <i class="fas fa-bars me-3" id="sidebarToggle" style="cursor:pointer; font-size: 1rem;"></i>
            <h5 class="mb-0 fw-bold" style="color: #1e4c8c;">Shop Date-Wise Sale Report</h5>
        </div>
        <div style="flex: 1; display: flex; justify-content: flex-end; align-items: center;">
            <div class="dropdown">
                <div class="d-flex align-items-center text-dark" data-bs-toggle="dropdown" style="cursor: pointer;">
                    <i class="fas fa-user-circle me-2" style="font-size: 1.2rem; color: #1e4c8c;"></i>
                    <span id="userName" class="me-2 fw-semibold">User</span>
                    <i class="fas fa-chevron-down" style="font-size: 0.7rem;"></i>
                </div>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                    <li><a class="dropdown-item logout-btn" href="#"><i
                                class="fas fa-sign-out-alt me-2 text-danger"></i>Sign Out</a></li>
                </ul>
            </div>
        </div>
    </div>

    <div class="main-container">
        <!-- Print-only Header -->
        <div id="printOnlyHeader" class="text-center">
            <h2 class="fw-bold mb-1" style="color: #1e4c8c;">BAS SOFTWARE SOLUTIONS</h2>
            <h4 class="mb-2">Shop Date-Wise Sale Report</h4>
            <div class="d-flex justify-content-center gap-4 text-muted small">
                <span><strong>From:</strong> <span id="printFromDate">-</span></span>
                <span><strong>To:</strong> <span id="printToDate">-</span></span>
                <span><strong>Generated:</strong> <span id="printGeneratedAt">-</span></span>
            </div>
        </div>

        <!-- Filter Panel -->

        <div class="filter-panel">
            <div class="filter-row">
                <div class="filter-group">
                    <label>Branch</label>
                    <select id="branchSelect" class="form-select">
                        <option value="">All Branches</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Department</label>
                    <select id="deptSelect" class="form-select select2-single" data-placeholder="Select Department">
                        <option value="">All Departments</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>From Date</label>
                    <input type="date" id="fromDate" class="form-control">
                </div>
                <div class="filter-group">
                    <label>To Date</label>
                    <input type="date" id="toDate" class="form-control">
                </div>
                <div class="d-flex gap-2 align-items-end">
                    <button class="btn btn-generate" onclick="generateReport()">
                        <i class="fas fa-file-alt me-2"></i> Generate Report
                    </button>
                    <button class="btn btn-reset" title="Reset Filters" onclick="location.reload()">
                        <i class="fas fa-redo"></i>
                    </button>
                    <button class="btn btn-print" title="Print Report" onclick="window.print()">
                        <i class="fas fa-print"></i>
                    </button>
                </div>

            </div>
        </div>

        <!-- Summary Row -->
        <div class="row g-3 mb-3 summary-row">

            <div class="col-md-4">
                <div class="summary-card-custom sale shadow-sm">
                    <div class="label">Total Sale</div>
                    <div class="value" id="netSale">0</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="summary-card-custom discount shadow-sm">
                    <div class="label">Total Discount</div>
                    <div class="value" id="totalDiscount">0</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="summary-card-custom net shadow-sm">
                    <div class="label">Total Net (Computer)</div>
                    <div class="value" id="totalNet">0</div>
                </div>
            </div>
        </div>

        <!-- Report Content -->
        <div id="reportContainer">
            <div class="data-panel shadow-sm">
                <div class="text-center py-5 text-muted">
                    <i class="fas fa-search fa-3x mb-3 opacity-25"></i>
                    <p>Use filters above to generate the report.</p>
                </div>
            </div>
        </div>
    </div>



    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/js/pageAccess.js"></script>
    <script src="/js/sidebar.js?v=1789486244529"></script>
    <script src="/js/shop-date-wise-sale-report.js"></script>
</body>

</html>
