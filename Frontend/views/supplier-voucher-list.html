<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Voucher List - Bilal Accounting System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/desktop-style.css" rel="stylesheet">
    <link href="/css/sidebar.css" rel="stylesheet">
    <style>
        :root {
            --supplier-blue: #2563eb;
            --supplier-blue-dark: #1e3a8a;
            --supplier-accent: #3b82f6;
            --supplier-header-grad: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
        }

        body {
            background-color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            color: #1e293b;
            transition: background-color 0.2s, color 0.2s;
        }

        .main-content {
            padding: 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #1e3a8a;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .page-subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* Distinct Filter Section */
        .filter-section-supplier {
            background-color: #ffffff;
            padding: 22px;
            border-radius: 0;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
            margin-bottom: 25px;
            border: 2px solid rgba(37, 99, 235, 0.15);
        }

        .filter-section-supplier .form-label {
            color: #334155;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .filter-section-supplier .form-control,
        .filter-section-supplier .form-select {
            border: 1.5px solid #cbd5e1;
            border-radius: 2px;
            padding: 8px 12px;
            font-size: 0.9rem;
            background-color: #ffffff;
            color: #0f172a;
        }

        .filter-section-supplier .form-control:focus,
        .filter-section-supplier .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        /* Distinct Table Card */
        .data-table-supplier {
            background-color: #ffffff;
            border-radius: 0;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
            border: 2px solid rgba(37, 99, 235, 0.15);
        }

        .table {
            margin-bottom: 0;
            color: #1e293b;
        }

        .table thead th {
            background: var(--supplier-header-grad) !important;
            color: #ffffff !important;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 14px 15px;
            border-bottom: 2px solid #1e3a8a !important;
            border-color: rgba(255, 255, 255, 0.15);
            vertical-align: middle;
        }

        .table thead th * {
            color: #ffffff !important;
        }

        .table tbody td {
            padding: 13px 15px;
            font-size: 0.92rem;
            vertical-align: middle;
            color: #1e293b;
            border-color: #e2e8f0;
        }

        .table tbody tr:hover td {
            background-color: #eff6ff !important;
            color: #0f172a !important;
        }

        .table-striped tbody tr:nth-of-type(odd) td {
            background-color: #f8fafc;
        }

        /* High-contrast Supplier Badge (Sharp, Not Round) */
        .badge-supplier {
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%) !important;
            color: #ffffff !important;
            padding: 4px 8px;
            border-radius: 2px;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: inline-block;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.25);
        }

        .action-btns .btn {
            border-radius: 6px;
            width: 32px;
            height: 32px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }

        /* Created By User Badge (Flat, Professional ERP Style) */
        .badge-created-by {
            background-color: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
            padding: 4px 8px;
            border-radius: 2px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
        }

        /* 1-Column System & IP Cell */
        .system-meta-cell {
            display: flex;
            flex-direction: column;
            gap: 2px;
            line-height: 1.2;
        }

        .system-meta-cell .comp-name {
            font-weight: 700;
            font-size: 0.82rem;
            color: #0f172a;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .system-meta-cell .comp-name i {
            color: #2563eb;
        }

        .system-meta-cell .comp-ip {
            font-size: 0.75rem;
            color: #64748b;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .system-meta-cell .comp-ip i {
            color: #059669;
        }

        /* ═══════════════════════════════════════════════════════════════
           DARK THEME SPECIFIC OVERRIDES (High Contrast, Crystal Clear)
           ═══════════════════════════════════════════════════════════════ */
        body.dark-theme,
        body.theme-dark,
        body.bas-theme-dark,
        body.bas-dash-theme-dark,
        html[data-theme="dark"] body,
        html[data-bs-theme="dark"] body,
        body[data-theme="dark"],
        body[data-bs-theme="dark"] {
            background-color: #0b1329 !important;
            color: #f8fafc !important;
        }

        /* Title in Dark Mode */
        body.dark-theme .page-title,
        body.theme-dark .page-title,
        body.bas-theme-dark .page-title,
        html[data-theme="dark"] .page-title,
        html[data-bs-theme="dark"] .page-title,
        body[data-theme="dark"] .page-title,
        body[data-bs-theme="dark"] .page-title {
            color: #ffffff !important;
        }

        body.dark-theme .page-subtitle,
        body.theme-dark .page-subtitle,
        html[data-theme="dark"] .page-subtitle,
        html[data-bs-theme="dark"] .page-subtitle {
            color: #94a3b8 !important;
        }

        /* Filter Section in Dark Mode */
        body.dark-theme .filter-section-supplier,
        body.theme-dark .filter-section-supplier,
        body.bas-theme-dark .filter-section-supplier,
        html[data-theme="dark"] .filter-section-supplier,
        html[data-bs-theme="dark"] .filter-section-supplier,
        body[data-theme="dark"] .filter-section-supplier,
        body[data-bs-theme="dark"] .filter-section-supplier {
            background-color: #131f37 !important;
            border-color: #2563eb !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5) !important;
        }

        body.dark-theme .filter-section-supplier .form-label,
        body.theme-dark .filter-section-supplier .form-label,
        body.bas-theme-dark .filter-section-supplier .form-label,
        html[data-theme="dark"] .filter-section-supplier .form-label,
        html[data-bs-theme="dark"] .filter-section-supplier .form-label {
            color: #93c5fd !important; /* Bright soft blue for crystal clarity */
        }

        body.dark-theme .filter-section-supplier .form-control,
        body.dark-theme .filter-section-supplier .form-select,
        body.theme-dark .filter-section-supplier .form-control,
        body.theme-dark .filter-section-supplier .form-select,
        body.bas-theme-dark .filter-section-supplier .form-control,
        body.bas-theme-dark .filter-section-supplier .form-select,
        html[data-theme="dark"] .filter-section-supplier .form-control,
        html[data-theme="dark"] .filter-section-supplier .form-select,
        html[data-bs-theme="dark"] .filter-section-supplier .form-control,
        html[data-bs-theme="dark"] .filter-section-supplier .form-select {
            background-color: #0a1122 !important;
            color: #ffffff !important;
            border-color: #223254 !important;
        }

        body.dark-theme .filter-section-supplier .form-control:focus,
        body.dark-theme .filter-section-supplier .form-select:focus,
        body.theme-dark .filter-section-supplier .form-control:focus,
        body.theme-dark .filter-section-supplier .form-select:focus,
        html[data-theme="dark"] .filter-section-supplier .form-control:focus,
        html[data-theme="dark"] .filter-section-supplier .form-select:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3) !important;
        }

        body.dark-theme .filter-section-supplier .form-control::placeholder,
        body.theme-dark .filter-section-supplier .form-control::placeholder,
        html[data-theme="dark"] .filter-section-supplier .form-control::placeholder {
            color: #64748b !important;
        }

        /* Data Table Container in Dark Mode */
        body.dark-theme .data-table-supplier,
        body.theme-dark .data-table-supplier,
        body.bas-theme-dark .data-table-supplier,
        html[data-theme="dark"] .data-table-supplier,
        html[data-bs-theme="dark"] .data-table-supplier,
        body[data-theme="dark"] .data-table-supplier,
        body[data-bs-theme="dark"] .data-table-supplier {
            background-color: #131f37 !important;
            border-color: #2563eb !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5) !important;
        }

        body.dark-theme .table,
        body.theme-dark .table,
        body.bas-theme-dark .table,
        html[data-theme="dark"] .table,
        html[data-bs-theme="dark"] .table {
            background-color: #131f37 !important;
            color: #f1f5f9 !important;
        }

        /* Table Cells in Dark Mode */
        body.dark-theme .table tbody td,
        body.theme-dark .table tbody td,
        body.bas-theme-dark .table tbody td,
        html[data-theme="dark"] .table tbody td,
        html[data-bs-theme="dark"] .table tbody td,
        body[data-theme="dark"] .table tbody td,
        body[data-bs-theme="dark"] .table tbody td {
            background-color: #131f37 !important;
            color: #f1f5f9 !important;
            border-color: #223254 !important;
        }

        body.dark-theme .table-striped tbody tr:nth-of-type(odd) td,
        body.theme-dark .table-striped tbody tr:nth-of-type(odd) td,
        html[data-theme="dark"] .table-striped tbody tr:nth-of-type(odd) td {
            background-color: #172440 !important;
            color: #f1f5f9 !important;
        }

        body.dark-theme .table-hover tbody tr:hover td,
        body.theme-dark .table-hover tbody tr:hover td,
        html[data-theme="dark"] .table-hover tbody tr:hover td {
            background-color: #1e3056 !important;
            color: #ffffff !important;
        }

        /* Bold Values (Voucher # and Amounts) */
        body.dark-theme .table tbody td.fw-bold,
        body.theme-dark .table tbody td.fw-bold,
        html[data-theme="dark"] .table tbody td.fw-bold {
            color: #ffffff !important;
        }

        body.dark-theme .table tbody td.text-truncate,
        body.theme-dark .table tbody td.text-truncate,
        html[data-theme="dark"] .table tbody td.text-truncate {
            color: #cbd5e1 !important;
        }

        /* Created By & System Meta in Dark Mode */
        body.dark-theme .badge-created-by,
        body.theme-dark .badge-created-by,
        body.bas-theme-dark .badge-created-by,
        html[data-theme="dark"] .badge-created-by,
        html[data-bs-theme="dark"] .badge-created-by {
            background-color: #172554 !important;
            color: #bfdbfe !important;
            border-color: #3b82f6 !important;
        }

        body.dark-theme .system-meta-cell .comp-name,
        body.theme-dark .system-meta-cell .comp-name,
        body.bas-theme-dark .system-meta-cell .comp-name,
        html[data-theme="dark"] .system-meta-cell .comp-name,
        html[data-bs-theme="dark"] .system-meta-cell .comp-name {
            color: #ffffff !important;
        }

        body.dark-theme .system-meta-cell .comp-name i,
        body.theme-dark .system-meta-cell .comp-name i,
        html[data-theme="dark"] .system-meta-cell .comp-name i {
            color: #60a5fa !important;
        }

        body.dark-theme .system-meta-cell .comp-ip,
        body.theme-dark .system-meta-cell .comp-ip,
        body.bas-theme-dark .system-meta-cell .comp-ip,
        html[data-theme="dark"] .system-meta-cell .comp-ip,
        html[data-bs-theme="dark"] .system-meta-cell .comp-ip {
            color: #94a3b8 !important;
        }

        body.dark-theme .system-meta-cell .comp-ip i,
        body.theme-dark .system-meta-cell .comp-ip i,
        html[data-theme="dark"] .system-meta-cell .comp-ip i {
            color: #34d399 !important;
        }

        /* Buttons in Dark Mode */
        body.dark-theme .btn-outline-secondary,
        body.theme-dark .btn-outline-secondary,
        html[data-theme="dark"] .btn-outline-secondary {
            color: #cbd5e1 !important;
            border-color: #475569 !important;
        }

        body.dark-theme .btn-outline-secondary:hover,
        body.theme-dark .btn-outline-secondary:hover,
        html[data-theme="dark"] .btn-outline-secondary:hover {
            background-color: #223254 !important;
            color: #ffffff !important;
        }

        body.dark-theme .btn-secondary,
        body.theme-dark .btn-secondary,
        html[data-theme="dark"] .btn-secondary {
            background-color: #334155 !important;
            border-color: #475569 !important;
            color: #f8fafc !important;
        }

        @media (max-width: 768px) {
            .page-header {
                padding: 0.5rem 1rem !important;
                background-color: #1e3a8a !important;
            }

            .main-content {
                padding: 10px !important;
            }
        }
    </style>
</head>

<body>
    <!-- Standardized Page Header -->
    <div class="page-header px-3">
        <div style="flex: 1; display: flex; align-items: center;">
            <i class="fas fa-bars me-3" id="sidebarToggle" style="cursor:pointer; font-size: 1rem;"></i>
            <h4 class="mb-0 text-white"><i class="fas fa-truck me-2"></i> Supplier Voucher List</h4>
        </div>
        <div style="flex: 1; display: flex; justify-content: flex-end; align-items: center;">
            <div class="dropdown">
                <div class="d-flex align-items-center text-white" data-bs-toggle="dropdown" style="cursor: pointer;">
                    <div class="avatar-circle me-2 bg-primary text-white d-flex align-items-center justify-content-center"
                        style="width: 35px; height: 35px; border-radius: 50%; font-weight: bold;">
                        <i class="fas fa-user"></i>
                    </div>
                    <span id="userName" class="me-2">User</span>
                    <i class="fas fa-chevron-down" style="font-size: 0.7rem;"></i>
                </div>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                    <li><a class="dropdown-item" href="/profile"><i class="fas fa-user-circle me-2"></i> Profile</a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item logout-btn" href="#"><i
                                class="fas fa-sign-out-alt me-2 text-danger"></i>Sign Out</a></li>
                </ul>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="row align-items-center mb-4">
            <div class="col-md-3"></div>
            <div class="col-md-6 text-center">
                <h1 class="page-title"><i class="fas fa-truck text-primary me-2"></i> Supplier Voucher List</h1>
                <p class="page-subtitle mb-0">View, search, edit and print all supplier payment vouchers</p>
            </div>
            <div class="col-md-3 text-end d-flex justify-content-end gap-2">
                <a href="/supplier-voucher" class="btn btn-outline-secondary"><i
                        class="fas fa-arrow-left me-2"></i> Back to Entry</a>
                <a href="/supplier-voucher" class="btn btn-primary" style="background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%); border: none;"><i class="fas fa-plus me-2"></i> Create Supplier Voucher</a>
            </div>
        </div>

        <div class="filter-section-supplier shadow-sm">
            <div class="row g-3 align-items-end">
                <div class="col-md-2">
                    <label class="form-label">Search</label>
                    <input type="text" id="listSearch" class="form-control" placeholder="Voucher # or Supplier">
                </div>
                <div class="col-md-2">
                    <label class="form-label">From Date</label>
                    <input type="date" id="listFromDate" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label">To Date</label>
                    <input type="date" id="listToDate" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Branch Filter</label>
                    <select id="listBranchFilter" class="form-select">
                        <option value="">All Branches</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Supplier Filter</label>
                    <select id="listSupplierFilter" class="form-select">
                        <option value="">All Suppliers</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100 fw-bold" style="background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%); border: none; height: 38px;" onclick="applyFilters()"><i class="fas fa-search me-2"></i> Search</button>
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-info text-white fw-bold" onclick="printFullList()"><i class="fas fa-print me-2"></i>
                    Print Full List</button>
                <button class="btn btn-secondary fw-bold" onclick="printSelected()"><i class="fas fa-check-double me-2"></i>
                    Print Selected</button>
            </div>
        </div>

        <div class="data-table-supplier shadow-sm">
            <table class="table table-hover table-striped">
                <thead>
                    <tr>
                        <th width="40"><input type="checkbox" id="selectAllVouchers" onclick="toggleSelectAll()"></th>
                        <th>Voucher #</th>
                        <th>Date</th>
                        <th>Supplier Name</th>
                        <th>Branch</th>
                        <th>Amount</th>
                        <th>Payment Method</th>
                        <th>Created By</th>
                        <th>System / IP</th>
                        <th>Remarks</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="voucherListBody">
                    <!-- Data loaded via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/pageAccess.js"></script>
    <script src="/js/sidebar.js?v=1789486244515"></script>
    <script src="/js/desktop-ui.js"></script>
    <script src="/js/payment-vouchers.js?v=203"></script>
</body>

</html>
