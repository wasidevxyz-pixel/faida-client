<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Payroll Status - Bilal Accounting System</title>
    <!-- CSS Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/sidebar.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1e4c8c 0%, #2c5ba9 100%);
            --accent-color: #00a65a;
            --border-color: rgba(255, 255, 255, 0.2);
        }

        body {
            background-color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 0.85rem;
        }

        .filter-panel {
            background: var(--primary-gradient);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            color: white;
        }

        .filter-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .filter-row:last-child {
            margin-bottom: 0;
            align-items: flex-end;
        }

        .filter-group {
            flex: 1;
            min-width: 150px;
        }

        .filter-panel label {
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
            display: block;
            opacity: 0.9;
            color: white;
        }

        .filter-panel .form-select,
        .filter-panel .form-control {
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.1);
            color: white !important;
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
            height: 38px;
            transition: all 0.3s;
        }

        .filter-panel .form-select option {
            background: #1e4c8c;
            color: white;
        }

        .filter-panel .form-select:focus,
        .filter-panel .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
            border-color: white;
            outline: none;
        }

        .data-panel {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #edf2f7;
        }

        .table-responsive {
            flex: 1;
            overflow: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            border: 1px solid #dee2e6;
            /* Added border */
        }

        .data-table thead th {
            background: #1e4c8c !important;
            /* Ensure blue */
            color: white !important;
            font-weight: 700;
            text-transform: uppercase;
            text-align: center;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
            padding: 12px 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .data-table tbody td {
            padding: 10px;
            border: 1px solid #dee2e6;
            /* Ensure border color matches */
            vertical-align: middle;
            color: #334155;
        }

        .dept-group-header {
            background: #f8fafc;
            color: #1e4c8c;
            font-weight: 800;
            padding: 5px 15px;
            border-bottom: 2px solid #dee2e6;
            text-align: center;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-right: 1px solid #dee2e6;
            border-left: 1px solid #dee2e6;
        }

        .branch-group-header {
            background: #334155 !important;
            padding: 8px;
            text-align: center;
            border-bottom: 2px solid #1e4c8c;
        }

        .branch-group-header td {
            color: #ffffff !important;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
        }

        /* ... existing styles ... */

        .grand-total-row td {
            padding: 12px 10px !important;
            vertical-align: middle;
            font-weight: 800;
            background: #1e4c8c !important;
            /* Blue total bg */
            color: white !important;
            /* White text */
            font-size: 0.9rem;
            border: 1px solid #dee2e6;
            border-top: 2px solid #143b75 !important;
        }

        .status-badge {
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 0.55rem;
            /* Reduced from 0.6rem */
            font-weight: 800;
            text-transform: uppercase;
            display: inline-block;
            line-height: 1;
            white-space: nowrap;
        }

        .joining-month-highlight {
            background-color: #fff9c4 !important;
        }

        .name-cell {
            white-space: nowrap;
            font-weight: 700;
        }

        .report-header-info {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px 8px 0 0;
            border-bottom: 2px solid #1e4c8c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .report-header-info h6 {
            margin: 0;
            font-weight: 800;
            color: #1e4c8c;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }

        .status-transfer {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .status-pending {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .btn-report {
            background: #00a65a;
            color: white;
            border: none;
            padding: 0 25px;
            height: 38px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .btn-report:hover {
            background: #218838;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        #suggestionsBox {
            position: absolute;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-height: 250px;
            overflow-y: auto;
            z-index: 1100;
            display: none;
            margin-top: 5px;
            border: 1px solid #e2e8f0;
        }

        .suggestion-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
            font-size: 0.8rem;
        }

        .suggestion-item:hover {
            background: #1e4c8c;
            color: white;
        }

        @media print {
            @page {
                size: portrait;
                margin: 5mm;
            }

            .no-print,
            .filter-panel,
            #sidebar,
            #sidebarToggle,
            .page-header {
                display: none !important;
            }

            .main-content {
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
            }

            .data-table {
                font-size: 7.5pt !important;
                width: 100% !important;
                table-layout: fixed !important;
            }

            .data-table thead th,
            .data-table tbody td {
                padding: 3px 2px !important;
                word-wrap: break-word;
                overflow: hidden;
            }

            .report-header-info {
                border-bottom: 2px solid #000 !important;
                margin-bottom: 15px !important;
                padding: 5px !important;
            }

            .data-table thead th {
                background: #1e4c8c !important;
                color: white !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                font-size: 7.5pt !important;
                padding: 4px 2px !important;
            }

            .dept-group-header {
                background: #eff6ff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                padding: 4px !important;
                text-align: center !important;
                font-size: 8pt !important;
            }

            .branch-group-header {
                background: #334155 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .branch-group-header td {
                color: #ffffff !important;
                font-size: 9pt !important;
                padding: 6px !important;
            }

            .grand-total-row td {
                padding: 4px 2px !important;
                background: #1e4c8c !important;
                color: white !important;
                font-weight: 900;
                font-size: 8pt !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .status-badge {
                font-size: 4.5pt !important;
                padding: 1px 3px !important;
                white-space: nowrap !important;
                line-height: 1 !important;
                border: 0.1px solid #ccc !important;
            }

            .name-cell {
                white-space: normal !important;
                font-size: 7.5pt !important;
                line-height: 1.1;
            }
        }
    </style>
</head>

<body>
    <div class="main-content">
        <div class="page-header px-3 d-flex align-items-center justify-content-center"
            style="height: 55px; background: #1e4c8c; color: white;">
            <h5 class="mb-0 fw-bold text-uppercase">Employee PayRoll Status</h5>
        </div>

        <div class="container-fluid p-3">
            <div class="filter-panel shadow-sm">
                <div class="filter-row">
                    <div class="filter-group">
                        <label>Month-Year</label>
                        <input type="month" class="form-control" id="monthYearFilter">
                    </div>
                    <div class="filter-group">
                        <label>Status</label>
                        <select class="form-select" id="statusFilter">
                            <option value="All">All</option>
                            <option value="Pending">Pending</option>
                            <option value="Transfer">Transfer</option>
                            <option value="Bank">Bank</option>
                            <option value="Cash">Cash</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Branch</label>
                        <select class="form-select" id="branchFilter">
                            <option value="All">Select Branch</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Department</label>
                        <select class="form-select" id="departmentFilter">
                            <option value="All">Select Department</option>
                        </select>
                    </div>
                </div>
                <div class="filter-row">
                    <div class="filter-group">
                        <label>Code</label>
                        <input type="text" class="form-control" id="codeFilter" placeholder="Code">
                    </div>
                    <div class="filter-group" style="flex: 2; position: relative;">
                        <label>Employee</label>
                        <input type="text" class="form-control" id="empSearch" placeholder="Select Employee">
                        <input type="hidden" id="selectedEmpId">
                        <div id="suggestionsBox"></div>
                    </div>
                    <div class="filter-group d-flex align-items-end">
                        <button class="btn btn-report w-100" onclick="generateReport()">
                            Report
                        </button>
                    </div>
                </div>
            </div>

            <div class="data-panel shadow-sm" id="reportContent">
                <div class="text-center py-5 text-muted">
                    <i class="fas fa-search fa-3x mb-3 opacity-25"></i>
                    <p>Click "Report" to view status.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/pageAccess.js"></script>
    <script src="/js/sidebar.js?v=1789486244475"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            document.getElementById('monthYearFilter').value = `${year}-${month}`;

            setInterval(() => {
                document.getElementById('currentTime').textContent = new Date().toLocaleString();
            }, 1000);

            loadFilters();
            setupSearch();
        });

        async function loadFilters() {
            try {
                // Load Branches (Standardized with dashboard fallback)
                let branchRes = await window.pageAccess.authenticatedFetch('/api/v1/stores');
                if (!branchRes.ok) {
                    branchRes = await window.pageAccess.authenticatedFetch('/api/v1/sub-branches');
                }

                const branchData = await branchRes.json();
                if (branchData.success && branchData.data) {
                    const branchSelect = document.getElementById('branchFilter');
                    branchSelect.innerHTML = '<option value="All">Select Branch</option>';

                    const rawNames = branchData.data.map(item => (item.name || item.branchName || '').trim());
                    const uniqueBranches = [...new Set(rawNames)].filter(n => n !== '').sort();

                    uniqueBranches.forEach(name => {
                        const opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name;
                        branchSelect.appendChild(opt);
                    });
                }

                // Load Departments
                const deptRes = await window.pageAccess.authenticatedFetch('/api/v1/employee-departments');
                const deptData = await deptRes.json();
                if (deptData.success) {
                    const deptSelect = document.getElementById('departmentFilter');
                    deptData.data.forEach(d => {
                        const opt = document.createElement('option');
                        opt.value = d._id;
                        opt.textContent = d.name;
                        deptSelect.appendChild(opt);
                    });
                }
            } catch (err) { console.error(err); }
        }

        async function generateReport() {
            const reportContainer = document.getElementById('reportContent');
            reportContainer.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

            const monthYear = document.getElementById('monthYearFilter').value;
            const status = document.getElementById('statusFilter').value;
            const branch = document.getElementById('branchFilter').value;
            const department = document.getElementById('departmentFilter').value;
            const code = document.getElementById('codeFilter').value;
            const employeeId = document.getElementById('selectedEmpId').value;

            try {
                const res = await window.pageAccess.authenticatedFetch(`/api/v1/salary-reports/emp-payroll-status?monthYear=${monthYear}&status=${status}&branch=${branch}&department=${department}&code=${code}&employeeId=${employeeId}`);
                const data = await res.json();

                if (data.success) {
                    renderReport(data.data);
                } else {
                    reportContainer.innerHTML = `<div class="alert alert-danger m-3">${data.message}</div>`;
                }
            } catch (err) {
                reportContainer.innerHTML = `<div class="alert alert-danger m-3">Error fetching report</div>`;
            }
        }

        function renderReport(data) {
            const container = document.getElementById('reportContent');
            if (data.length === 0) {
                container.innerHTML = '<div class="text-center py-5 text-muted">No records found.</div>';
                return;
            }

            const monthYear = document.getElementById('monthYearFilter').value; // YYYY-MM
            const branchFilterValue = document.getElementById('branchFilter').value;
            const status = document.getElementById('statusFilter').value;

            // Hierarchical Grouping: Branch -> Department
            const grouped = {};
            data.forEach(item => {
                const branch = item.branch || 'General';
                const dept = item.department || 'Unassigned';
                if (!grouped[branch]) grouped[branch] = {};
                if (!grouped[branch][dept]) grouped[branch][dept] = [];
                grouped[branch][dept].push(item);
            });

            let html = `
                <!-- Print Only Header -->
                <div class="d-none d-print-block text-center mb-4">
                    <h2 style="color: #1e4c8c; margin-bottom: 5px; font-weight: 800;">EMPLOYEE PAYROLL STATUS</h2>
                    ${branchFilterValue !== 'All' ? `<h5 style="text-transform: uppercase;">${branchFilterValue}</h5>` : ''}
                    <p>Month: ${monthYear} | Status Filter: ${status}</p>
                    <hr style="border-top: 2px solid #1e4c8c;">
                </div>

                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 4%">SR.</th>
                                <th style="width: 8%">CODE</th>
                                <th style="width: 25%">EMPLOYEE NAME</th>
                                <th style="width: 18%">DESIGNATION</th>
                                <th style="width: 10%">PAYMENT</th>
                                <th style="width: 15%; text-align: right;">NET SALARY</th>
                                <th style="width: 10%">JOINING</th>
                                <th style="width: 10%">STATUS</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            let srNo = 1;
            let totalNet = 0;

            const [reportYear, reportMonth] = monthYear.split('-').map(Number);

            for (const branch in grouped) {
                // Show Branch as heading only if searching all or multiple
                if (branchFilterValue === 'All' || Object.keys(grouped).length > 1) {
                    html += `<tr class="branch-group-header"><td colspan="8">${branch}</td></tr>`;
                }

                for (const dept in grouped[branch]) {
                    html += `<tr><td colspan="8" class="dept-group-header">${dept}</td></tr>`;

                    grouped[branch][dept].forEach(item => {
                        totalNet += (item.netSalary || 0);
                        const statusClass = item.status === 'Transfer' ? 'status-transfer' : 'status-pending';

                        // Check if joining date is in selected month
                        let highlightClass = '';
                        if (item.joiningDate) {
                            const joinDate = new Date(item.joiningDate);
                            if (joinDate.getFullYear() === reportYear && (joinDate.getMonth() + 1) === reportMonth) {
                                highlightClass = 'joining-month-highlight';
                            }
                        }

                        html += `
                            <tr class="${highlightClass}">
                                <td class="text-center text-muted">${srNo++}</td>
                                <td class="text-center fw-bold text-primary">${item.code}</td>
                                <td class="name-cell">${item.name}</td>
                                <td class="text-center">${item.designation}</td>
                                <td class="text-center">${item.paymentMode}</td>
                                <td class="text-end fw-bold" style="font-family: 'Courier New', Courier, monospace; font-size: 1rem;">${(item.netSalary || 0).toLocaleString()}</td>
                                <td class="text-center">${item.joiningDate ? new Date(item.joiningDate).toLocaleDateString('en-GB') : '-'}</td>
                                <td class="text-center"><span class="status-badge ${statusClass}">${item.status}</span></td>
                            </tr>
                        `;
                    });
                }
            }

            html += `
                        </tbody>
                        <tfoot>
                            <tr class="grand-total-row">
                                <td colspan="5" class="text-end">GRAND TOTAL:</td>
                                <td class="text-end" style="font-family: 'Courier New', Courier, monospace;">${totalNet.toLocaleString()}</td>
                                <td colspan="2"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <div class="p-4 text-end no-print d-flex justify-content-end gap-3" style="background: #f8fafc; border-top: 1px solid #e2e8f0;">
                    <button class="btn btn-outline-primary" onclick="exportData()"><i class="fas fa-file-excel me-2"></i>Export Excel</button>
                    <button class="btn btn-primary px-5" onclick="window.print()"><i class="fas fa-print me-2"></i>Print Quality Report</button>
                </div>
            `;

            container.innerHTML = html;
        }

        function setupSearch() {
            const input = document.getElementById('empSearch');
            const box = document.getElementById('suggestionsBox');

            input.addEventListener('input', async (e) => {
                const val = e.target.value;
                if (val.length < 2) {
                    box.style.display = 'none';
                    return;
                }

                try {
                    const res = await window.pageAccess.authenticatedFetch(`/api/v1/employees?search=${val}`);
                    const data = await res.json();
                    if (data.success) {
                        box.innerHTML = '';
                        data.data.forEach(emp => {
                            const div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.textContent = `${emp.code} - ${emp.name}`;
                            div.onclick = () => {
                                input.value = emp.name;
                                document.getElementById('selectedEmpId').value = emp._id;
                                document.getElementById('codeFilter').value = emp.code;
                                box.style.display = 'none';
                            };
                            box.appendChild(div);
                        });
                        box.style.display = 'block';
                    }
                } catch (err) { }
            });

            document.addEventListener('click', (e) => {
                if (e.target !== input) box.style.display = 'none';
            });
        }

        function exportData() {
            // Placeholder for export functionality
            alert('Exporting to Excel...');
        }
    </script>
</body>

</html>
