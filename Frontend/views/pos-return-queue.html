<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sale Return Approval Queue | BW Software Agency</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/desktop-style.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/pos-return-queue.css">
</head>
<body>
  <header class="approval-topbar">
    <div>
      <h1 class="h5 mb-0">Sale Return Approval Queue</h1>
      <small>Approve or reject pending return requests</small>
    </div>
    <div class="d-flex align-items-center gap-2">
      <a class="btn btn-outline-light btn-sm" href="/pos-sale"><i class="fas fa-cash-register me-1"></i>POS</a>
      <a class="btn btn-outline-light btn-sm logout-btn" href="#"><i class="fas fa-right-from-bracket me-1"></i>Sign out</a>
    </div>
  </header>

  <main class="approval-page">
    <section class="approval-panel">
      <div class="approval-heading">
        <div>
          <h2 class="h5 mb-1">Pending Sale Returns</h2>
          <p class="text-muted small mb-0">Stock and ledger update only after approval.</p>
        </div>
        <button type="button" class="btn btn-outline-primary btn-sm" id="refreshQueue">
          <i class="fas fa-rotate me-1"></i>Refresh
        </button>
      </div>
      <div id="queueStatus" class="approval-status" role="status" aria-live="polite">Loading pending requests…</div>
      <div id="queueList" class="approval-list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/pageAccess.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/desktop-ui.js"></script>
  <script src="/js/pos-return-queue.js"></script>
</body>
</html>
