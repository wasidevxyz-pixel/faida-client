<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance Sheet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background: white;
            font-size: 0.8rem;
        }

        .sheet-container {
            page-break-after: always;
            margin-bottom: 20px;
        }

        .report-header {
            text-align: center;
            margin-bottom: 15px;
        }

        .report-header h1 {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 0;
            text-transform: uppercase;
        }

        .report-header h2 {
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: underline;
            margin: 5px 0;
        }

        .meta-grid {
            border: 2px solid black;
            display: flex;
            margin-bottom: 5px;
        }

        .meta-box {
            border-right: 1px solid black;
            padding: 5px;
            text-align: center;
            flex: 1;
        }

        .meta-box:last-child {
            border-right: none;
        }

        .meta-label {
            display: block;
            font-weight: bold;
            font-size: 0.75rem;
            border-bottom: 1px solid black;
            background: #eee;
            margin: -5px -5px 5px -5px;
            padding: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }

        th,
        td {
            border: 1px solid black;
            padding: 2px 4px;
            text-align: center;
        }

        thead th {
            background-color: black !important;
            color: white !important;
            border: 1px solid white !important;
            /* Visual separation in black header */
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.7rem;
            padding: 4px;
            vertical-align: middle;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        tfoot td {
            background-color: #eee !important;
            font-weight: bold;
            border: 1px solid black;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Specific Column Widths base on reference */
        .col-date {
            width: 80px;
        }

        .col-day {
            width: 70px;
        }

        .col-time {
            width: 60px;
        }

        .col-hrs {
            width: 50px;
        }

        .col-status {
            width: 40px;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 5mm;
            }

            body {
                margin: 0;
                padding: 0;
            }

            .no-print {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="no-print text-center p-3 mb-3 bg-light border-bottom">
        <button onclick="window.print()" class="btn btn-primary">Print Report</button>
        <button onclick="window.close()" class="btn btn-secondary">Close</button>
    </div>

    <!-- Container for dynamic sheets -->
    <div id="reportContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/print-employee-attendance-report.js?v=3"></script>
</body>

</html>
