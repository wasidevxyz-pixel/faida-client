<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sale Return Approval &amp; Management | BW Software Agency</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/desktop-style.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/pos-return-queue.css">
  <style>
    .queue-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 2px solid #0055a5;
      padding-bottom: 8px;
    }
    .queue-tab-btn {
      background: #eaf1f9;
      border: 1px solid #7098c7;
      border-radius: 6px;
      padding: 6px 14px;
      font-weight: 700;
      font-size: 13px;
      color: #0b345e;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .queue-tab-btn:hover {
      background: #d4e5f7;
    }
    .queue-tab-btn.active {
      background: #0055a5;
      color: #ffffff;
      border-color: #003366;
    }
    .queue-tab-btn .badge {
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header class="approval-topbar">
    <div>
      <h1 class="h5 mb-0">Sale Return Management</h1>
      <small>Approve, Review Posted, or View Rejected Returns</small>
    </div>
    <div class="d-flex align-items-center gap-2">
      <a class="btn btn-outline-light btn-sm" href="/pos-sale"><i class="fas fa-cash-register me-1"></i>POS Sale</a>
      <a class="btn btn-outline-light btn-sm logout-btn" href="#"><i class="fas fa-right-from-bracket me-1"></i>Sign out</a>
    </div>
  </header>

  <main class="approval-page">
    <section class="approval-panel">
      <!-- Status Tabs: Pending, Approved/Posted, Rejected -->
      <div class="queue-tabs">
        <button type="button" class="queue-tab-btn active" data-status="Pending Approval" id="tabPending">
          <i class="fas fa-clock"></i>
          <span>Pending Approval</span>
          <span class="badge bg-warning text-dark" id="pendingCount">0</span>
        </button>
        <button type="button" class="queue-tab-btn" data-status="Posted" id="tabPosted">
          <i class="fas fa-check-circle"></i>
          <span>Approved &amp; Posted</span>
          <span class="badge bg-success" id="postedCount">0</span>
        </button>
        <button type="button" class="queue-tab-btn" data-status="Cancelled" id="tabRejected">
          <i class="fas fa-ban"></i>
          <span>Rejected Returns</span>
          <span class="badge bg-danger" id="rejectedCount">0</span>
        </button>
        <button type="button" class="btn btn-outline-primary btn-sm ms-auto" id="refreshQueue">
          <i class="fas fa-rotate me-1"></i>Refresh
        </button>
      </div>

      <div id="queueStatus" class="approval-status" role="status" aria-live="polite">Loading requests…</div>
      <div id="queueList" class="approval-list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/pageAccess.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/desktop-ui.js"></script>
  <script src="/js/pos-return-queue.js?v=20261113"></script>
</body>
</html>
