<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print - OverTime & Short Time Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        body {
            background-color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 10px;
            margin: 0;
            padding: 0;
            color: #000;
        }

        @page {
            size: A4 landscape;
            margin: 8mm;
        }

        @media print {
            .no-print {
                display: none !important;
            }

            body {
                margin: 0;
                padding: 0;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            thead {
                display: table-header-group;
            }

            tr {
                page-break-inside: avoid;
            }
        }

        .report-header {
            text-align: center;
            margin-bottom: 12px;
            border-bottom: 2px solid #000;
            padding-bottom: 8px;
        }

        .report-header h1 {
            font-size: 20px;
            font-weight: 800;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #000;
        }

        .report-header h2 {
            font-size: 15px;
            font-weight: 700;
            margin: 4px 0 2px 0;
            color: #1e293b;
        }

        .meta-subtitle {
            font-size: 11px;
            font-weight: 600;
            color: #334155;
        }

        .meta-info-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 6px;
            font-size: 10px;
        }

        .meta-pill {
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            padding: 2px 10px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* KPI summary boxes */
        .summary-boxes {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .summary-box {
            flex: 1;
            border: 1px solid #000;
            padding: 6px 10px;
            border-radius: 4px;
            background: #f8fafc;
            text-align: center;
        }

        .summary-box-val {
            font-size: 13px;
            font-weight: 800;
            color: #000;
        }

        .summary-box-lbl {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            color: #475569;
        }

        table.print-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto;
        }

        table.print-table thead tr {
            background-color: #0f172a !important;
            color: #fff !important;
        }

        table.print-table th {
            background-color: #0f172a !important;
            color: #fff !important;
            border: 1px solid #000 !important;
            padding: 6px 4px;
            text-align: center;
            font-weight: 700;
            font-size: 9px;
            text-transform: uppercase;
            vertical-align: middle;
        }

        table.print-table td {
            border: 1px solid #000 !important;
            padding: 4px 4px;
            text-align: center;
            font-size: 9px;
            vertical-align: middle;
        }

        table.print-table tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        table.print-table tfoot tr {
            background-color: #e2e8f0 !important;
            font-weight: 800;
        }

        table.print-table tfoot td {
            background-color: #e2e8f0 !important;
            border: 1.5px solid #000 !important;
            font-weight: 800;
            font-size: 9.5px;
        }

        .text-start {
            text-align: left !important;
            padding-left: 6px !important;
        }

        .text-end {
            text-align: right !important;
            padding-right: 6px !important;
        }

        .text-ot {
            color: #065f46 !important;
            font-weight: 700;
        }

        .text-st {
            color: #991b1b !important;
            font-weight: 700;
        }

        /* Signatures Section */
        .signatures-section {
            margin-top: 35px;
            display: flex;
            justify-content: space-between;
            page-break-inside: avoid;
        }

        .signature-box {
            width: 21%;
            text-align: center;
            border-top: 1.5px solid #000;
            padding-top: 5px;
            font-size: 9.5px;
            font-weight: 700;
            text-transform: uppercase;
            color: #000;
        }
    </style>
</head>

<body>
    <div id="reportContainer" class="p-2">
        <!-- Javascript populates print content -->
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/js/print-overtime-shorttime-report.js?v=20260829-1"></script>
</body>

</html>
