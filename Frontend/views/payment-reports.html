<!DOCTYPE html>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Report Logic
        let allData = null;
        let branches = [];
        let categories = [];

        document.addEventListener('DOMContentLoaded', async () => {
            // Set default dates (current month)
            // Set default dates (current month)
            const now = new Date();
            // Local Start of Month
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const firstDay = `${year}-${month}-01`;

            // Local End of Month
            const end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
            const endYear = end.getFullYear();
            const endMonth = String(end.getMonth() + 1).padStart(2, '0');
            const endDay = String(end.getDate()).padStart(2, '0');
            const lastDay = `${endYear}-${endMonth}-${endDay}`;

            document.getElementById('startDate').value = firstDay;
            document.getElementById('endDate').value = lastDay;

            // Load filters
            await loadFilters();
            await loadCompanyInfo();

            // Set user name
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (document.getElementById('userName')) {
                document.getElementById('userName').textContent = user.name || 'User';
            }

            // Global search event
            document.getElementById('globalSearch').addEventListener('input', () => {
                if (allData) renderReport(allData);
            });
        });

        async function loadFilters() {
            try {
                const token = localStorage.getItem('token');
                const headers = { 'Authorization': `Bearer ${token}` };

                let branchRes = await fetch('/api/v1/stores', { headers });
                if (!branchRes.ok) {
                    branchRes = await fetch('/api/v1/sub-branches', { headers });
                }
                const catRes = await fetch('/api/v1/customer-categories', { headers });

                const branchData = await branchRes.json();
                const catData = await catRes.json();

                const branchSelect = document.getElementById('branchFilter');
                if (branchData.success && branchData.data) {
                    const rawNames = branchData.data.map(item => (item.name || item.branchName || '').trim());
                    const uniqueBranches = [...new Set(rawNames)].filter(n => n !== '').sort();

                    uniqueBranches.forEach(name => {
                        const opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name;
                        branchSelect.appendChild(opt);
                    });
                }

                const catSelect = document.getElementById('categoryFilter');
                catData.data.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat._id;
                    option.textContent = cat.name;
                    catSelect.appendChild(option);
                    categories.push({ id: cat._id, name: cat.name });
                });

                branches = branchData.data;
            } catch (err) {
                console.error('Error loading filters:', err);
            }
        }

        async function loadCompanyInfo() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/v1/settings', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();

                if (result.success && result.data) {
                    const settings = result.data;
                    document.getElementById('printCompanyName').textContent = settings.companyName || 'D.Watson Group Of Pharmacies';
                    document.getElementById('printCompanyInfo').textContent = settings.address || '';

                    if (settings.logo) {
                        const logoImg = document.getElementById('printCompanyLogo');
                        logoImg.src = settings.logo;
                        logoImg.style.display = 'block';
                    }
                }

                // Add Generated Date
                const today = new Date();
                const genDate = document.getElementById('printDateNow');
                if (genDate) {
                    genDate.textContent = `Generated: ${today.toLocaleDateString('en-GB')} ${today.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`;
                }
            } catch (err) {
                console.error('Error loading company info:', err);
            }
        }

        function resetFilters() {
            const now = new Date();
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
            const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0);

            document.getElementById('startDate').value = startOfMonth.toISOString().split('T')[0];
            document.getElementById('endDate').value = endOfMonth.toISOString().split('T')[0];
            document.getElementById('branchFilter').value = 'all';
            document.getElementById('categoryFilter').value = 'all';
            document.getElementById('globalSearch').value = '';

            document.getElementById('reportResults').innerHTML = '';
            document.getElementById('summarySection').classList.add('d-none');
            document.getElementById('emptyState').classList.remove('d-none');
        }

        async function loadReport() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const branch = document.getElementById('branchFilter').value;
            const categoryId = document.getElementById('categoryFilter').value;

            if (!startDate || !endDate) {
                alert('Please select date range');
                return;
            }

            // UI States
            document.getElementById('generateSpinner').classList.remove('d-none');
            document.getElementById('generateBtn').disabled = true;
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('emptyState').classList.add('d-none');
            document.getElementById('reportResults').innerHTML = '';
            document.getElementById('summarySection').classList.add('d-none');

            try {
                const token = localStorage.getItem('token');
                const headers = { 'Authorization': `Bearer ${token}` };
                const limit = 10000;

                // Fetch data in parallel
                const [sheetsRes, vouchRes] = await Promise.all([
                    fetch(`/api/v1/closing-sheets/report?startDate=${startDate}&endDate=${endDate}&branch=${branch}`, { headers }),
                    fetch(`/api/v1/vouchers?startDate=${startDate}&endDate=${endDate}&branch=${branch}&limit=${limit}`, { headers })
                ]);

                const sheetsData = await sheetsRes.json();
                const vouchData = await vouchRes.json();

                // Update Print Meta
                const pbMeta = document.getElementById('printBranchMeta');
                if (pbMeta) pbMeta.textContent = branch === 'all' ? 'All Branches' : branch;

                const pdMeta = document.getElementById('printDateMeta');
                if (pdMeta) pdMeta.textContent = `${formatDatePrint(startDate)} to ${formatDatePrint(endDate)}`;

                const pdNow = document.getElementById('printDateNow');
                if (pdNow) pdNow.textContent = new Date().toLocaleString();

                processData(sheetsData.data, vouchData.data);
            } catch (err) {
                console.error('Error loading report:', err);
                alert('Error loading report data');
            } finally {
                document.getElementById('generateSpinner').classList.add('d-none');
                document.getElementById('generateBtn').disabled = false;
                document.getElementById('loadingState').style.display = 'none';
            }
        }

        function formatDatePrint(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function processData(sheets, vouchers) {
            const normalize = (name) => (name || '').toLowerCase().replace(/[^a-z0-9]/g, '');
            const stats = {}; // Map<CategoryName, Map<BranchName, {sale, cost, payment}>>

            const catMap = {};
            categories.forEach(c => catMap[c.id] = c.name);

            // 1. Process Closing Sheets (Sale & Cost)
            sheets.forEach(sheet => {
                const branchName = sheet.branch;
                const dataObj = sheet.closing02?.data || sheet.closing02;

                if (dataObj && dataObj.warehouseSale && Array.isArray(dataObj.warehouseSale)) {
                    dataObj.warehouseSale.forEach(item => {
                        const catName = catMap[item.category] || 'Unknown Category';

                        // Category Filter
                        const selectedCatId = document.getElementById('categoryFilter').value;
                        if (selectedCatId !== 'all' && item.category !== selectedCatId) return;

                        if (!stats[catName]) stats[catName] = {};
                        if (!stats[catName][branchName]) {
                            stats[catName][branchName] = { branch: branchName, sale: 0, cost: 0, payment: 0 };
                        }

                        stats[catName][branchName].sale += parseFloat(item.sale || 0);
                        stats[catName][branchName].cost += parseFloat(item.cost || 0);
                    });
                }
            });

            // 2. Process Vouchers (Payments)
            vouchers.forEach(v => {
                const branchName = v.branch;
                // Filter by branch if not 'all'
                const selectedBranch = document.getElementById('branchFilter').value;
                if (selectedBranch !== 'all' && branchName !== selectedBranch) return;

                const categoryEntry = v.entries.find(e => e.detail === 'Category Wise Payment');
                if (!categoryEntry) return;

                const categoryNameFromVoucher = categoryEntry.account;
                const amount = parseFloat(categoryEntry.debit || 0);

                // Try to find matching category in our stats
                let matchedCatName = categoryNameFromVoucher;
                const knownCatNames = Object.values(catMap);

                const match = knownCatNames.find(c =>
                    normalize(c) === normalize(categoryNameFromVoucher) ||
                    normalize(categoryNameFromVoucher).includes(normalize(c)) ||
                    normalize(c).includes(normalize(categoryNameFromVoucher))
                );

                if (match) matchedCatName = match;

                // Category Filter
                const selectedCatId = document.getElementById('categoryFilter').value;
                if (selectedCatId !== 'all') {
                    const selectedCatName = catMap[selectedCatId];
                    if (normalize(matchedCatName) !== normalize(selectedCatName)) return;
                }

                if (!stats[matchedCatName]) stats[matchedCatName] = {};
                if (!stats[matchedCatName][branchName]) {
                    stats[matchedCatName][branchName] = { branch: branchName, sale: 0, cost: 0, payment: 0 };
                }

                stats[matchedCatName][branchName].payment += amount;
            });

            allData = stats;
            renderReport(stats);
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', {
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(amount || 0);
        }

        function renderReport(stats) {
            const resultsArea = document.getElementById('reportResults');
            const searchTerm = normalize(document.getElementById('globalSearch').value);
            resultsArea.innerHTML = '';

            let grandTotalSales = 0, grandTotalCost = 0, grandTotalPaid = 0;
            let hasAnyData = false;

            const sortedCatNames = Object.keys(stats).sort();

            sortedCatNames.forEach(catName => {
                const branchMap = stats[catName];
                const branchesToShow = Object.values(branchMap).filter(b => {
                    const matchesSearch = normalize(catName).includes(searchTerm) || normalize(b.branch).includes(searchTerm);
                    const hasValues = b.sale !== 0 || b.cost !== 0 || b.payment !== 0;
                    return matchesSearch && hasValues;
                }).sort((a, b) => b.sale - a.sale);

                if (branchesToShow.length === 0) return;
                hasAnyData = true;

                let catTotalSale = 0, catTotalCost = 0, catTotalPaid = 0;

                let rowsHtml = '';
                branchesToShow.forEach((b, idx) => {
                    const balance = b.cost - b.payment;
                    catTotalSale += b.sale;
                    catTotalCost += b.cost;
                    catTotalPaid += b.payment;

                    rowsHtml += `
                        <tr>
                            <td data-label="S#">${idx + 1}</td>
                            <td data-label="Branch">${b.branch}</td>
                            <td data-label="Sales">${formatCurrency(b.sale)}</td>
                            <td data-label="Cost">${formatCurrency(b.cost)}</td>
                            <td data-label="Paid">${formatCurrency(b.payment)}</td>
                            <td data-label="Balance" class="${balance > 0 ? 'balance-danger' : 'balance-success'}">${formatCurrency(balance)}</td>
                        </tr>
                    `;
                });

                const catBalance = catTotalCost - catTotalPaid;
                grandTotalSales += catTotalSale;
                grandTotalCost += catTotalCost;
                grandTotalPaid += catTotalPaid;

                const categorySection = `
                    <div class="category-card">
                        <div class="category-header">
                            <i class="fas fa-box-open"></i> ${catName}
                        </div>
                        <div class="table-responsive">
                            <table class="data-table">
                                <colgroup>
                                    <col class="col-sno">
                                    <col class="col-branch">
                                    <col class="col-numeric">
                                    <col class="col-numeric">
                                    <col class="col-numeric">
                                    <col class="col-numeric">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th style="border-left: none !important;">S#</th>
                                        <th style="border-left: 1px solid white !important;">Branch</th>
                                        <th style="border-left: 1px solid white !important;">Sales</th>
                                        <th style="border-left: 1px solid white !important;">Cost</th>
                                        <th style="border-left: 1px solid white !important;">Paid</th>
                                        <th style="border-left: 1px solid white !important;">Balance</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rowsHtml}
                                </tbody>
                                <tfoot>
                                    <tr class="total-row">
                                        <td colspan="2" style="border-left: none !important;">Total</td>
                                        <td data-label="Total Sales" style="border-left: 1px solid #dee2e6 !important;">${formatCurrency(catTotalSale)}</td>
                                        <td data-label="Total Cost" style="border-left: 1px solid #dee2e6 !important;">${formatCurrency(catTotalCost)}</td>
                                        <td data-label="Total Paid" style="border-left: 1px solid #dee2e6 !important;">${formatCurrency(catTotalPaid)}</td>
                                        <td data-label="Total Balance" style="border-left: 1px solid #dee2e6 !important;">${formatCurrency(catBalance)}</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                `;
                resultsArea.insertAdjacentHTML('beforeend', categorySection);
            });

            if (!hasAnyData) {
                resultsArea.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h5>No matches found</h5>
                        <p>Try adjusting your search or filters.</p>
                    </div>
                `;
                document.getElementById('summarySection').classList.add('d-none');
            } else {
                // Update Summary
                document.getElementById('totalSales').textContent = formatCurrency(grandTotalSales);
                document.getElementById('totalCost').textContent = formatCurrency(grandTotalCost);
                document.getElementById('totalPaid').textContent = formatCurrency(grandTotalPaid);
                document.getElementById('totalBalance').textContent = formatCurrency(grandTotalCost - grandTotalPaid);
                document.getElementById('summarySection').classList.remove('d-none');

                // Final Grand Total Row aligned with table columns
                const grandTotalHtml = `
                    <div class="grand-total-section">
                        <table class="grand-total-table">
                            <colgroup>
                                <col class="col-sno">
                                <col class="col-branch">
                                <col class="col-numeric">
                                <col class="col-numeric">
                                <col class="col-numeric">
                                <col class="col-numeric">
                            </colgroup>
                            <tr>
                                <td colspan="2" class="grand-total-label" style="border-left: none !important;">
                                    <i class="fas fa-calculator me-2"></i> Grand Total
                                </td>
                                <td class="grand-total-value" style="border-left: 1px solid rgba(255,255,255,0.3) !important;">
                                    <span class="grand-total-sublabel">Sales</span>
                                    ${formatCurrency(grandTotalSales)}
                                </td>
                                <td class="grand-total-value" style="border-left: 1px solid rgba(255,255,255,0.3) !important;">
                                    <span class="grand-total-sublabel">Cost</span>
                                    ${formatCurrency(grandTotalCost)}
                                </td>
                                <td class="grand-total-value" style="border-left: 1px solid rgba(255,255,255,0.3) !important;">
                                    <span class="grand-total-sublabel">Paid</span>
                                    ${formatCurrency(grandTotalPaid)}
                                </td>
                                <td class="grand-total-value" style="border-left: 1px solid rgba(255,255,255,0.3) !important;">
                                    <span class="grand-total-sublabel">Balance</span>
                                    ${formatCurrency(grandTotalCost - grandTotalPaid)}
                                </td>
                            </tr>
                        </table>
                    </div>
                `;
                resultsArea.insertAdjacentHTML('beforeend', grandTotalHtml);

                // Add Signature Section for Print
                const signatureHtml = `
                    <div class="print-footer-signatures d-none">
                        <div class="sig-box">
                            <div class="sig-line"></div>
                            <div class="sig-label">Prepared By</div>
                        </div>
                        <div class="sig-box">
                            <div class="sig-line"></div>
                            <div class="sig-label">Checked By</div>
                        </div>
                        <div class="sig-box">
                            <div class="sig-line"></div>
                            <div class="sig-label">Approved By</div>
                        </div>
                    </div>
                `;
                resultsArea.insertAdjacentHTML('beforeend', signatureHtml);
            }
        }

        function normalize(name) {
            return (name || '').toLowerCase().trim();
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
